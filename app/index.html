       *
       * 以前三张占位图是固定 PNG，底色用的是蓝色主题那套（写死在
       * check/make_placeholders.py 里），换到雾青主题就特别刺眼。
       * 现在在浏览器里用 Canvas 画 —— 零依赖，而且配色面板一动它跟着变。
       *
       * 为什么不是直接换图：图里的字是画在位图上的，改 HTML 没用；
       * 而微信要求必须是真图片，读者才能在公众号里单击选中后替换成自己的图。 */
      var PH_SPEC = {
        cover: { w: 1080, h: 460, title: '封面占位图', line1: '这里是文章封面', line2: '公众号里单击选中 → 上传你的图' },
        image: { w: 1080, h: 720, title: '配图占位', line1: '这里放配图', line2: '公众号里单击选中 → 上传你的图' },
        video: { w: 1080, h: 608, title: '视频占位', line1: '这里放视频封面', line2: '公众号里插入视频后替换' }
      };
      var phCache = { key: '', data: {} };

      function phColors(theme) {
        var tk = (theme && theme.tokens) || {};
        return {
          bg: tk.accentSoft || '#eff6ff',
          border: tk.accentTint || '#bfdbfe',
          accent: tk.accent || '#2563eb',
          muted: tk.textMuted || '#64748b'
        };
      }

      function drawPlaceholder(kind, theme) {
        var sp = PH_SPEC[kind];
        if (!sp) return '';
        var c = phColors(theme);
        // 尺寸跟着引擎里那套走（w/h/ratio 是渲染时算 padding-top 用的），别自造一套
        var spec0 = (window.GZH.placeholders && window.GZH.placeholders[kind]) || {};
        var W = spec0.w || sp.w, H = spec0.h || sp.h;
        var cv = document.createElement('canvas');
        cv.width = W; cv.height = H;
        var g = cv.getContext('2d');
        if (!g) return '';

        g.fillStyle = c.bg; g.fillRect(0, 0, W, H);

        // 外框虚线
        g.strokeStyle = c.border; g.lineWidth = 3; g.setLineDash([14, 10]);
        g.strokeRect(16, 16, W - 32, H - 32);
        g.setLineDash([]);

        // 对角线 —— 让人一眼看出「这是张空图」
        g.strokeStyle = c.border; g.lineWidth = 2;
        g.beginPath(); g.moveTo(16, 16); g.lineTo(W - 16, H - 16);
        g.moveTo(W - 16, 16); g.lineTo(16, H - 16); g.stroke();

        var cx = W / 2, cy = H / 2;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        // 中间挖一块底色，保证文字在任何笔色下都看得清
        g.fillStyle = c.bg; g.fillRect(cx - 420, cy - 96, 840, 192);
        g.strokeStyle = c.border; g.lineWidth = 2; g.strokeRect(cx - 420, cy - 96, 840, 192);

        g.fillStyle = c.accent;
        g.font = 'bold 52px "PingFang SC","Microsoft YaHei",sans-serif';
        g.fillText(sp.line1, cx, cy - 34);
        g.fillStyle = c.muted;
        g.font = '34px "PingFang SC","Microsoft YaHei",sans-serif';
        g.fillText(sp.line2, cx, cy + 32);

        // 左上角小标签 + 尺寸
        g.fillStyle = c.accent;
        g.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
        g.textAlign = 'left';
        g.fillText(sp.title, 44, 60);
        g.fillStyle = c.muted;
        g.font = '26px monospace';
        g.textAlign = 'right';
        g.fillText(W + ' × ' + H, W - 44, H - 44);

        return cv.toDataURL('image/png');
      }

      /* 每次渲染前刷一遍。把主题里参与配色的几个值拼成 key，
       * 值没变就直接吃缓存 —— Canvas 画三张图虽然只要几十毫秒，
       * 但拖滑块时每一帧都重画没必要。 */
      function refreshPlaceholders(theme) {
        if (!theme || !window.GZH || !window.GZH.placeholders) return;
        var c = phColors(theme);
        var key = [c.bg, c.border, c.accent, c.muted].join('|');
        if (phCache.key === key) {
          Object.keys(phCache.data).forEach(function (k) {
            window.GZH.placeholders[k].uri = phCache.data[k];
          });
          return;
        }
        var data = {};
        try {
          Object.keys(PH_SPEC).forEach(function (kind) {
            var uri = drawPlaceholder(kind, theme);
            if (uri) {
              data[kind] = uri;
              if (window.GZH.placeholders[kind]) window.GZH.placeholders[kind].uri = uri;
            }
          });
        } catch (e) {
          return;   // canvas 用不了（极少见）就继续用原来的固定图，不打断渲染
        }
        phCache = { key: key, data: data };
      }

      function render() {
        /* 自定义组件的模板走的是 FALLBACK 那条路（主题里没有它的 components 条目），
         * 所以每次渲染前必须把最新的 overrides 同步进 GZH.MODULES / FALLBACK，
         * 否则「改了模板预览不变」—— 会让人以为编辑器坏了。 */
        syncCustomModules();

        var md = mdEl.value;
        if (!md.trim()) {
          previewEl.innerHTML = '';
          barEl.innerHTML = '';
          issuesEl.innerHTML = '';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        var theme = currentTheme();
        if (!theme) {
          barEl.innerHTML = '';
          issuesEl.innerHTML = '<div class="issue">还没有可用的主题。</div>';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        // 占位图按当前主题配色重画 —— 放在渲染前，ir.js 取的就是这张
        refreshPlaceholders(theme);

        var ast, ir, html;
        // 发布面板要从 IR 里取标题/作者，存一份引用，避免为了取标题再解析一次稿子
        window.__gzhLastIR = null;
        try {
          ast = window.GZH.parse(md);
          ir = window.GZH.toIR(ast);
          html = window.GZH.render(ir, theme);
        } catch (e) {
          issuesEl.innerHTML = '<div class="issue">渲染失败：' + e.message + '</div>';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        // 已上传过的图（base64 → 微信 URL）在这里套回去：
        // 上传一次，之后每次重渲染都直接用微信的地址，不用再传一遍
        html = applyImgMap(html);

        currentHTML = html;
        previewEl.innerHTML = html;
        window.__gzhLastIR = ir;

        $('statBlocks').textContent = ir.blocks.length + ' 个区块';
        $('statBytes').textContent = html.length.toLocaleString() + ' 字节';

        // 体检
        var v = window.GZH.verdict(window.GZH.metrics(html), theme.rules);
        var m = v.metrics;

        barEl.innerHTML = '';
        addChip('flex', m.flex, m.flex > 0, '布局容器');
        addChip('渐变', m.gradient, true, '');
        addChip('start', m.start, m.start === 0, '');
        addChip('left', m.left, m.left === 0, '');
        addChip('leaf', m.leafSpan, m.leafSpan > 0, '叶节点');
        addChip('污染', m.browserJunk, m.browserJunk === 0, '');
        addChip('模板', m.templateResidue, m.templateResidue === 0, '未替换标记');

        var hints = [];

        // 盒子字段是否齐全 —— 这几条是「用户根本不知道自己该填什么」的地方，必须明示
        var mh = null, pf = null;
        ir.blocks.forEach(function (b) {
          if (b.role === 'masthead') mh = b;
          if (b.role === 'profile') pf = b;
        });

        if (mh && mh.coverPlaceholder) {
          hints.push('刊头卡封面现在用的是<b>占位图</b>。想用自己的封面，就在 <code>:::masthead</code> 盒子里给 '
            + '<code>cover:</code> 填一个图片 URL（留空会一直用占位图；也可以粘到公众号后直接点图替换）。');
        }
        if (mh && !mh.account) {
          hints.push('还没填公众号名称：在 <code>:::masthead</code> 盒子里补一行 '
            + '<code>account: 你的公众号名</code>，刊头卡顶部眉标会显示它。');
        }
        if (!pf) {
          hints.push('这篇文章还没有<b>作者卡</b> —— 点左栏「作者卡」，盒子插在文末就是署名区。');
        } else if (!pf.author && !pf.account) {
          hints.push('作者卡里还是空的：至少填 <code>author:</code> 和 <code>account:</code> 两项。');
        }

        if (m.placeholder > 0) {
          hints.push('有 <b>' + m.placeholder + ' 处是占位图</b>（含封面/配图/视频）。'
            + '粘到公众号后，按图上的文字提示替换成你自己的素材 —— 视频要先在后台「素材库 → 视频」上传。');
        }
        if (m.tempLink > 0) {
          hints.push('检测到 <b>' + m.tempLink + ' 个临时图片链接</b>（飞书云文档 / 带签名参数的直链）。'
            + '这类链接<u>过几小时就会失效</u>，粘到公众号后会变成死图。'
            + '建议在语法里把它们改成 <code>![]()</code>，改用占位图。');
        }

        issuesEl.innerHTML = (v.ok
          ? '<div class="ok-note">体检通过，可以复制。</div>'
          : v.issues.map(function (s) { return '<div class="issue">' + s + '</div>'; }).join(''))
          + hints.map(function (s) { return '<div class="hint-note">' + s + '</div>'; }).join('');

        copyBtn.disabled = !v.ok;
      }

      function addChip(label, num, good, note) {
        var s = document.createElement('span');
        s.className = 'chip ' + (good ? 'good' : 'bad');
        s.textContent = label + ' ' + num + (note ? ' · ' + note : '');
        s.title = label + ' = ' + num;
        barEl.appendChild(s);
      }

      function copy() {
        if (!currentHTML) return;
        copyBtn.disabled = true;
        // 关键：走 ClipboardItem 直写原始字符串，绝不 selectNodeContents
        window.GZH.clipboard.write(currentHTML).then(function (r) {
          toast('已复制 ' + r.bytes.toLocaleString() + ' 字节，去编辑器粘贴吧');
          copyBtn.disabled = false;
        }).catch(function (e) {
          window.GZH.clipboard.writeFallback(previewEl).then(function (r) {
            toast('已降级为屏幕复制：' + (r.warn || '可能带入多余样式'));
            copyBtn.disabled = false;
          });
        });
      }

      /* ---------- AI 用法弹层 ---------- */
      var mask = $('mask');
      function openAI() {
        $('aiBody').innerHTML =
          '<p><b>怎么用：</b>把下面这段提示词复制给任意 AI（ChatGPT / Claude / 豆包 / Kimi 都行），'
          + '再把它写的稿子一起发过去。AI 会直接输出这套排版语法的全文，粘回中间这栏即可。</p>'
          + '<pre>' + escHtml($('aiPrompt').textContent.trim()) + '</pre>'
          + '<p style="color:#6b7280;">你不需要记任何语法 —— 记语法的活交给 AI。'
          + '本工具只负责把语法渲染成干净、可直贴公众号的 HTML。</p>';
        mask.classList.add('show');
      }
      function closeAI() { mask.classList.remove('show'); }

      $('aiBtn').addEventListener('click', openAI);
      $('aiClose').addEventListener('click', closeAI);
      mask.addEventListener('click', function (e) { if (e.target === mask) closeAI(); });
      $('aiCopy').addEventListener('click', function () {
        var txt = $('aiPrompt').textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () {
            toast('提示词已复制，粘给 AI 并把稿子一起发过去');
          }).catch(function () { toast('复制失败，请手动选中提示词复制'); });
        } else {
          toast('当前环境不支持一键复制，请手动选中复制');
        }
      });

      var debounce;
      mdEl.addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(render, 220);
      });
      themeSel.addEventListener('change', function () {
        loadOverrides(themeSel.value);   // 每套主题各自的改动分开存，互不干扰
        buildModules();
        render();
      });
      copyBtn.addEventListener('click', copy);
      $('sampleBtn').addEventListener('click', function () {
        mdEl.value = $('sampleMd').textContent.trim();
        render();
        toast('已载入示例，改一改就能看到实时变化');
      });

      /* ---------- 配色面板 ----------
       *
       * 只暴露「跟主色走」的那几个 token，而不是把 15 个 token 全摊开：
       * 阴影、链接、加粗、渐变端点都是引用，改主色它们自己会跟，
       * 再给一遍旋钮只会让人不知道该动哪个。
       */
      var COLOR_KEYS = [
        ['accent', '主色', '标题、序号、强调'],
        ['accentSub', '副色', '次级强调'],
        ['accentSoft', '浅底', '行内代码底色、卡片淡底、渐变卡起点'],
        ['accentSoft2', '浅底 2', '更淡的底色、署名与行动卡渐变起点'],
        ['accentTint', '边框', '卡片描边'],
        ['accentTint2', '下划线', '链接下划线'],
        ['accentLine', '装饰线', '分隔线、渐变端点']
      ];

      var colorMask = $('colorMask'), colorBody = $('colorBody'), curTab = 'color';

      /* 尺度面板直接对着主题的 base 块 —— render.js 取值是
       * Object.assign(tokens, base, block)，这些本来就是数据字段，改完即时生效。 */
      var FONT_OPTS = [
        ['-apple-system,system-ui,\'PingFang SC\',\'Hiragino Sans GB\',\'Microsoft YaHei\',sans-serif', '系统黑体（苹方 / 雅黑）'],
        ['\'IBM Plex Sans\',-apple-system,\'PingFang SC\',\'Microsoft YaHei\',sans-serif', 'IBM Plex Sans'],
        ['Georgia,\'Songti SC\',\'SimSun\',serif', '衬线宋体'],
        ['Optima,\'PingFang SC\',\'Microsoft YaHei\',sans-serif', 'Optima 人文体']
      ];

      var SCALE_KEYS = [
        ['fontSize', '正文字号', 'range', 13, 19, 0.5, 'px', '手机屏通常是 15–16px'],
        ['fontSizeTitle', '标题字号', 'range', 18, 32, 1, 'px', '章节大标题'],
        ['lineHeight', '行距', 'range', 1.4, 2.4, 0.05, '', '公众号常见 1.75–1.95'],
        ['letterSpacing', '字间距', 'range', 0, 3, 0.1, 'px', '超过 1px 会显得松散'],
        ['paraGap', '段间距', 'range', 0, 40, 1, 'px', '段落之间'],
        ['chapterGap', '章节间距', 'range', 0, 80, 2, 'px', '章节之间'],
        ['cardGap', '卡片间距', 'range', 0, 60, 1, 'px', '卡片、组件之间'],
        ['itemGap', '条目间距', 'range', 0, 30, 1, 'px', '列表条目之间'],
        ['align', '对齐', 'select', 0, 0, 0, '', '正文默认两端对齐'],
        ['fontFamily', '字体', 'select', 0, 0, 0, '', '微信端最终以读者手机字体为准']
      ];

      /* 面板本体：一个弹层三个页签。curTab 决定渲染哪一页，
       * 每次重绘都按当前 overrides 取值，所以「改了立刻看得见」。 */
      function openColor(tab) {
        if (!currentTheme()) { toast('先选一个主题'); return; }
        curTab = tab || curTab || 'color';
        drawTabs();
        if (curTab === 'color') tabColor();
        else if (curTab === 'scale') tabScale();
        else tabComp();
        colorMask.classList.add('show');
      }

      function drawTabs() {
        Array.prototype.forEach.call($('colorTabs').querySelectorAll('.tab'), function (b) {
          b.classList.toggle('on', b.getAttribute('data-tab') === curTab);
        });
      }

      /* ---------- 页签①：配色 ---------- */
      function tabColor() {
        var t = currentTheme();
        var html = '<p style="margin:0 0 12px;color:#6b7280;">改完右侧预览会立刻变。'
          + '满意了就点「导出主题文件」，拿到的是一个能直接用的主题文件。</p>'
          + '<p style="margin:0 0 12px;color:#92400e;">卡片和渐变线的底色由「浅底」决定，'
          + '只拖主色不会变 —— 想整套换色，7 个都要改。</p>';

        COLOR_KEYS.forEach(function (row) {
          var key = row[0], label = row[1], note = row[2];
          var val = (overrides.tokens[key] || t.tokens[key] || '#000000');
          html += '<div class="crow">'
            + '<span class="crow-k"><b>' + label + '</b><em>' + note + '</em></span>'
            + '<input type="color" value="' + val + '" data-k="' + key + '">'
            + '<code class="crow-v" data-v="' + key + '">' + val + '</code>'
            + '</div>';
        });

        html += exportRow();
        colorBody.innerHTML = html;

        Array.prototype.forEach.call(colorBody.querySelectorAll('input[type=color]'), function (inp) {
          inp.addEventListener('input', function () {
            var k = inp.getAttribute('data-k');
            overrides.tokens[k] = inp.value;
            var vEl = colorBody.querySelector('.crow-v[data-v="' + k + '"]');
            if (vEl) vEl.textContent = inp.value;
            saveOverrides();
            render();
          });
        });
      }

      // 「导出为 xxx」这一行，三个页签共用
      function exportRow() {
        return '<div class="crow crow-id">'
          + '<span class="crow-k"><b>导出为</b><em>主题 id / 名称，随便起</em></span>'
          + '<input type="text" id="newThemeId" value="' + suggestId() + '">'
          + '<input type="text" id="newThemeName" value="' + suggestName() + '">'
          + '</div>';
      }

      function closeColor() { colorMask.classList.remove('show'); }

      /* ---------- 页签②：尺度 ----------
       * 对着主题 JSON 的 base 块。以前这些值只躺在文件里，
       * 想改只能手改 JSON 再重编译 —— 现在是一排滑块。 */
      function tabScale() {
        var t = currentTheme();
        if (!t) return;
        var base = t.base || {};

        var html = '<p style="margin:0 0 12px;color:#6b7280;">字号、行距、间距、对齐 —— '
          + '这些都是主题的尺度字段，拖一下右侧预览立刻变。</p>';

        SCALE_KEYS.forEach(function (row) {
          var k = row[0], label = row[1], type = row[2], unit = row[6], note = row[7];
          var cur = overrides.base[k] !== undefined ? overrides.base[k] : base[k];
          if (cur === undefined) cur = '';
          html += '<div class="crow">'
            + '<span class="crow-k"><b>' + label + '</b><em>' + note + '</em></span>';

          if (type === 'range') {
            var num = parseFloat(cur);
            if (!num && num !== 0) num = row[3];
            html += '<input type="range" min="' + row[3] + '" max="' + row[4] + '" step="' + row[5]
              + '" value="' + num + '" data-k="' + k + '" data-unit="' + unit + '" style="width:200px;">'
              + '<code class="crow-v" data-v="' + k + '">' + cur + '</code>';
          } else {
            var opts = k === 'align'
              ? [['justify', '两端对齐'], ['left', '左对齐'], ['center', '居中']] : FONT_OPTS;
            html += '<select data-k="' + k + '" style="width:230px;">';
            opts.forEach(function (o) {
              html += '<option value="' + String(o[0]).replace(/"/g, '&quot;') + '"'
                + (String(cur) === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
            });
            html += '</select>';
          }
          html += '</div>';
        });

        html += exportRow();
        colorBody.innerHTML = html;

        Array.prototype.forEach.call(colorBody.querySelectorAll('input[type=range]'), function (inp) {
          inp.addEventListener('input', function () {
            var k = inp.getAttribute('data-k');
            var v = inp.value + (inp.getAttribute('data-unit') || '');
            overrides.base[k] = v;
            var vEl = colorBody.querySelector('.crow-v[data-v="' + k + '"]');
            if (vEl) vEl.textContent = v;
            saveOverrides(); render();
          });
        });
        Array.prototype.forEach.call(colorBody.querySelectorAll('select'), function (sel) {
          sel.addEventListener('change', function () {
            overrides.base[sel.getAttribute('data-k')] = sel.value;
            saveOverrides(); render();
          });
        });
      }

      /* ---------- 页签③：组件 ----------
       *
       * 两件事：
       *   改模板 —— 主题里每个组件就是一段 HTML 字符串，摊开来改，右边即时预览、下面实时体检。
       *   造组件 —— 骨架（这个盒子怎么取值）以前写在 modules.js 代码里，只能在已有的十几个挑。
       *             这里现场按规矩生成一条 grammar 塞进 GZH.MODULES 就完了，ir.js 不用改。
       */
      var cmpSel = null;

      function compRoles() {
        var t = currentTheme() || themes[themeSel.value] || {};
        var built = Object.keys(t.components || {});
        var mine = Object.keys(effectiveModules());
        return built.concat(mine.filter(function (r) { return built.indexOf(r) < 0; }));
      }

      function roleName(role) {
        var m = window.GZH.MODULES && window.GZH.MODULES[role];
        if (m && m.ui && m.ui.label) return m.ui.label;
        var mine = effectiveModules()[role];
        return (mine && mine.name) || role;
      }

      // 当前生效的模板：你改过的 > 主题自带的 > 引擎内置兜底
      function tplOf(role) {
        if (overrides.tpl[role] !== undefined) return overrides.tpl[role];
        var t = themes[themeSel.value];
        var c = t && t.components && t.components[role];
        if (c && c.tpl) return c.tpl;
        var m = window.GZH.MODULES && window.GZH.MODULES[role];
        return (m && m.fallback && m.fallback.tpl) || '';
      }
      function itemOf(role) {
        if (overrides.item[role] !== undefined) return overrides.item[role];
        var t = themes[themeSel.value];
        var c = t && t.components && t.components[role];
        if (c && c.item) return c.item;
        var m = window.GZH.MODULES && window.GZH.MODULES[role];
        return (m && m.fallback && m.fallback.item) || '';
      }

      function tabComp() {
        var roles = compRoles();
        if (!cmpSel || roles.indexOf(cmpSel) < 0) cmpSel = roles[0] || null;

        var html = '<p style="margin:0 0 10px;color:#6b7280;">选一个组件，左边点它的元素、'
          + '右边逐项改属性 —— 字号、颜色、圆角、阴影都是一个个字段，不用碰 HTML。'
          + '下面即时预览，实时体检，改坏了点「恢复默认」。</p>'
          + '<div class="cmp-row" style="margin-bottom:10px;">'
          + '<button class="mini" id="cmpNewBtn">+ 新建组件</button>'
          + '<span style="font-size:11px;color:#9ca3af;">组件＝稿子里 :::xxx 那个盒子长什么样</span>'
          + '</div>'
          + '<div class="cmp-new" id="cmpNewBox">' + cmpNewFormHTML() + '</div>'
          + '<div class="cmp-wrap"><div class="cmp-list">';

        roles.forEach(function (r) {
          html += '<div class="cmp-item' + (r === cmpSel ? ' on' : '') + '" data-role="' + r + '">'
            + '<span class="cn">' + escHtml(roleName(r)) + '</span>'
            + (effectiveModules()[r] ? '<span class="tagx">自建</span>' : '')
            + (overrides.hidden[r] ? '<span class="tagx hide">隐藏</span>' : '')
            + ((overrides.tpl[r] !== undefined || overrides.tree[r]) ? '<span class="tagx">改过</span>' : '')
            + '</div>';
        });

        html += '</div><div class="cmp-main">'
          + (cmpSel ? cmpEditorHTML(cmpSel) : '<div class="cmp-prev-empty">从左边选一个组件。</div>')
          + '</div></div>' + exportRow();

        colorBody.innerHTML = html;
        bindComp();
        if (cmpSel) checkAndPreview(cmpSel);
      }

      /* ---------- 组件编辑器：元素树 + 属性面板 ----------
       *
       * 两个模式，随时可切：
       *   元素 —— 左边点节点，右边逐项改属性。看不到 HTML，改的是一个个字段。
       *   源码 —— 直接改 HTML 字符串。元素树做不到的效果（比如手写的一段特殊结构）在这里兜底。
       *
       * 为什么还要留源码模式：翻译器有保守规则，译不出来的一律保留为 html 节点。
       * 没有源码模式的话，那部分就彻底改不了了 —— 那才叫能力倒退。
       *
       * 编辑的元素树存在 overrides.tree[role][treeKey]，currentTheme() 会把它
       * 放进 theme.compositions —— render 的 pickComp 优先取 compositions，
       * 所以树一旦改过就自动盖住旧的 tpl，不需要显式清理。
       */
      var cmpMode = 'tree';      // tree | src
      var cmpTreeKey = 'tree';   // tree | itemTree
      var cmpPath = [0];

      // 「当前生效的元素树」：改过 > 主题自带 > 由 tpl 现场翻译
      // 最后一条让老主题和第三方主题也能立刻元素化编辑，不需要先跑迁移。
      function baseTreeOf(role, key) {
        var t = themes[themeSel.value] || {};
        var c = t.compositions && t.compositions[role];
        if (c && c[key]) return c[key];
        var src = key === 'itemTree' ? itemOf(role) : tplOf(role);
        return src ? window.GZH.tplToTree(src) : [];
      }
      function treeOf(role, key) {
        var mine = overrides.tree[role];
        if (mine && mine[key]) return mine[key];
        return baseTreeOf(role, key);
      }
      // 可写的树：第一次改动时把基线深拷进 override，之后就地修改
      function editTree(role, key) {
        overrides.tree[role] = overrides.tree[role] || {};
        if (!overrides.tree[role][key]) {
          overrides.tree[role][key] = JSON.parse(JSON.stringify(baseTreeOf(role, key)));
        }
        return overrides.tree[role][key];
      }

      function nodeSlotOf(tree, path) {
        var list = tree;
        for (var i = 0; i < path.length - 1; i++) {
          if (!list[path[i]]) return null;
          list = list[path[i]].children = list[path[i]].children || [];
        }
        return { list: list, idx: path[path.length - 1] };
      }
      function nodeAt(role, key, path) {
        var s = nodeSlotOf(treeOf(role, key), path);
        return s ? s.list[s.idx] : null;
      }
      function writeNode(role, key, path, fn) {
        var tree = editTree(role, key);
        var s = nodeSlotOf(tree, path);
        if (!s || !s.list[s.idx]) return;
        fn(s.list[s.idx], s);
        saveOverrides(); render(); previewComp(role);
      }
      function emptyStyle() { return { 'margin': '0', __order: ['margin'], __semi: true }; }

      function samePath(a, b) { return a.join('.') === b.join('.'); }

      function treeNodesHTML(nodes, path) {
        var h = '';
        (nodes || []).forEach(function (n, i) {
          var p = path.concat([i]);
          var ty = window.GZH.ELEMENT_TYPES[n.type] || { label: n.type };
          h += '<div class="enode' + (samePath(p, cmpPath) ? ' on' : '')
            + (n.type === 'html' ? ' raw' : '') + '" data-path="' + p.join('.') + '"'
            + ' style="padding-left:' + (6 + (p.length - 1) * 11) + 'px;">'
            + '<span class="ety">' + escHtml(ty.label) + '</span>'
            + '<span class="eco">' + escHtml(window.GZH.nodeSummary(n)) + '</span></div>'
            + treeNodesHTML(n.children, p);
        });
        return h;
      }

      /* 一个样式项配一个控件。控件类型由 CSS 属性名查表决定 ——
       * 查不到就给纯文本框，所以「没登记过的 CSS 属性」照样能改，只是没有专用控件。 */
      function styleRowHTML(key, val) {
        var E = window.GZH;
        var meta = E.propMeta(key);
        var h = '<div class="eprow"><span class="epk" title="' + escHtml(key) + '">'
          + escHtml(meta.label) + '</span>';
        var s = String(val == null ? '' : val);
        var opts = E.CSS_ENUMS[key];

        if (meta.ctrl === 'color') {
          h += '<input type="color" class="ep-color" data-k="' + escHtml(key) + '" value="'
            + (/^#[0-9a-fA-F]{6}$/.test(s) ? s : '#888888') + '">'
            + '<input type="text" class="ep-st" data-k="' + escHtml(key) + '" value="'
            + escHtml(s) + '" spellcheck="false">';
        } else if (opts && s.indexOf('{{') < 0) {
          h += '<select class="ep-st" data-k="' + escHtml(key) + '">'
            + opts.map(function (o) {
              return '<option value="' + escHtml(o) + '"' + (o === s ? ' selected' : '') + '>' + o + '</option>';
            }).join('')
            + '<option value=""' + (opts.indexOf(s) < 0 ? ' selected' : '') + '>自定义（在下面手填）</option></select>'
            + '<input type="text" class="ep-st" data-k="' + escHtml(key) + '" value="'
            + escHtml(s) + '" spellcheck="false" style="max-width:130px;">';
        } else if (/^-?[\d.]+(px|%|em|rem)?$/.test(s)) {
          // 纯数值才给数字框；「0 0 12px」这类复合值退回文本框，免得改坏
          var num = parseFloat(s) || 0;
          var unit = String(s).replace(/^-?[\d.]+/, '') || 'px';
          h += '<input type="number" class="ep-px" data-k="' + escHtml(key) + '" data-u="' + escHtml(unit)
            + '" value="' + num + '" step="1"><span class="unit">' + escHtml(unit) + '</span>';
        } else {
          h += '<input type="text" class="ep-st" data-k="' + escHtml(key) + '" value="'
            + escHtml(s) + '" spellcheck="false">';
        }
        h += '<button class="mini ep-delst" data-k="' + escHtml(key) + '" title="删除这一项">×</button>';
        return h + '</div>';
      }

      var STYLE_PRESET = ['font-size', 'color', 'background', 'padding', 'margin', 'margin-top',
        'border', 'border-radius', 'line-height', 'letter-spacing', 'text-align', 'font-weight',
        'box-shadow', 'width', 'height', 'gap', 'display'];

      function propsHTML(node) {
        var E = window.GZH;
        if (!node) return '<div class="epempty">在左边的树里点一个元素。</div>';
        var ty = E.ELEMENT_TYPES[node.type] || { label: node.type, desc: '' };
        var h = '<div class="eph">' + escHtml(ty.label) + '<em>' + escHtml(ty.desc || '') + '</em></div>';

        if (node.type === 'html') {
          return h + '<div class="epempty">这一块结构太不规则，没能拆成元素，'
            + '保持在「源码」模式里改它。</div>'
            + '<div class="eprow"><button class="mini" data-eact="delnode">删除这个块</button></div>';
        }

        h += '<div class="eprow"><span class="epk">类型</span><select class="ep-type">'
          + Object.keys(E.ELEMENT_TYPES).map(function (k) {
            return '<option value="' + k + '"' + (k === node.type ? ' selected' : '') + '>'
              + escHtml(E.ELEMENT_TYPES[k].label) + '</option>';
          }).join('') + '</select></div>';

        ['text', 'badge', 'chip', 'slot'].forEach(function (tt) {
          if (node.type !== tt) return;
          var f = tt === 'slot' ? 'name' : 'text';
          h += '<div class="eprow"><span class="epk">' + (tt === 'slot' ? '槽位名' : '文字内容')
            + '</span><input type="text" class="ep-field" data-f="' + f + '" value="'
            + escHtml(node[f] == null ? '' : node[f]) + '" spellcheck="false"></div>';
        });
        if (node.type === 'image') {
          h += '<div class="eprow"><span class="epk">图片地址</span><input type="text" class="ep-field"'
            + ' data-f="src" value="' + escHtml(node.src == null ? '' : node.src) + '" spellcheck="false"></div>';
        }

        h += '<div class="eprow"><span class="epk">显示条件</span><input type="text" class="ep-field"'
          + ' data-f="if" value="'
          + escHtml(Array.isArray(node.if) ? node.if.join(',') : (node.if || ''))
          + '" placeholder="留空=总是显示，如 cover" spellcheck="false"></div>';

        var st = node.style || {};
        var keys = (st.__order || Object.keys(st)).filter(function (k) {
          return k.indexOf('__') !== 0 && Object.prototype.hasOwnProperty.call(st, k);
        });
        h += '<div class="eprow grp"><span class="epk">样式</span><em style="font-size:11px;color:#9ca3af;">'
          + keys.length + ' 项</em></div>';
        keys.forEach(function (k) { h += styleRowHTML(k, st[k]); });

        h += '<div class="eprow grp"><span class="epk">加一项样式</span><select class="ep-newkey">'
          + STYLE_PRESET.map(function (k) {
            return '<option value="' + k + '">' + escHtml(E.propMeta(k).label) + '（' + k + '）</option>';
          }).join('') + '</select>'
          + '<button class="mini" data-eact="addstyle">加</button></div>';

        if (ty.withChildren) {
          h += '<div class="eprow grp"><span class="epk">子元素</span><select class="ep-newtype">'
            + Object.keys(E.ELEMENT_TYPES).map(function (k) {
              return '<option value="' + k + '">' + escHtml(E.ELEMENT_TYPES[k].label) + '</option>';
            }).join('') + '</select>'
            + '<button class="mini" data-eact="addchild">添加</button></div>';
        }
        h += '<div class="eprow grp"><span class="epk"></span>'
          + '<button class="mini" data-eact="delnode" style="color:#991b1b;">删除这个元素</button></div>';
        return h;
      }

      function srcEditorHTML(role, item, hasItem) {
        return '<textarea class="cmp-tpl" id="cmpTpl" spellcheck="false">' + escHtml(tplOf(role)) + '</textarea>'
          + (hasItem
            ? '<div class="cmp-row"><label>列表项模板（每个 - 条目渲染成什么）</label></div>'
            + '<textarea class="cmp-tpl" id="cmpItem" spellcheck="false" style="min-height:86px;">'
            + escHtml(item) + '</textarea>' : '');
      }

      function cmpEditorHTML(role) {
        var item = itemOf(role);
        var srcComp = (themes[themeSel.value] || {}).components || {};
        var m = window.GZH.MODULES && window.GZH.MODULES[role];
        var hasItem = !!(item || (srcComp[role] && srcComp[role].item) || (m && m.fallback && m.fallback.item));
        if (!hasItem && cmpTreeKey === 'itemTree') cmpTreeKey = 'tree';

        var h = '<h4>' + escHtml(roleName(role)) + '<em>:::' + role + '</em>'
          + '<span style="flex:1"></span>'
          + '<button class="mini" data-act="hide" data-role="' + role + '">'
          + (overrides.hidden[role] ? '取消隐藏' : '隐藏') + '</button>'
          + '<button class="mini" data-act="reset" data-role="' + role + '">恢复默认</button>'
          + (effectiveModules()[role]
            ? '<button class="mini" data-act="del" data-role="' + role + '">删除组件</button>' : '')
          + '</h4>'
          + '<div class="cmp-row" style="margin-bottom:8px;">'
          + '<button class="mini" data-act="mode" data-m="tree"'
          + (cmpMode === 'tree' ? ' style="border-color:#2563eb;color:#1d4ed8;"' : '') + '>元素</button>'
          + '<button class="mini" data-act="mode" data-m="src"'
          + (cmpMode === 'src' ? ' style="border-color:#2563eb;color:#1d4ed8;"' : '') + '>源码</button>'
          + '<span style="font-size:11px;color:#9ca3af;">'
          + (cmpMode === 'tree' ? '点元素改属性，不用碰 HTML'
            : '直接改 HTML —— 元素模式做不到的效果在这里改') + '</span></div>';

        if (cmpMode === 'tree') {
          h += '<div class="cmp-row" style="margin-bottom:8px;"><label>编辑</label>'
            + '<select id="tkSel">'
            + '<option value="tree"' + (cmpTreeKey === 'tree' ? ' selected' : '') + '>组件的主体</option>'
            + (hasItem ? '<option value="itemTree"' + (cmpTreeKey === 'itemTree' ? ' selected' : '')
              + '>列表项（每条 - 项目）</option>' : '')
            + '</select></div>'
            + '<div class="cmp-wrap"><div class="etree">' + treeNodesHTML(treeOf(role, cmpTreeKey), []) + '</div>'
            + '<div class="eprops" id="eprops">' + propsHTML(nodeAt(role, cmpTreeKey, cmpPath)) + '</div></div>';
        } else {
          h += srcEditorHTML(role, item, hasItem);
        }

        return h + '<div class="cmp-msg" id="cmpMsg"></div>'
          + '<div class="cmp-row"><label>预览 · 按这个组件的样例内容渲染</label></div>'
          + '<div class="cmp-prev" id="cmpPrev"></div>';
      }

      function bindComp() {
        Array.prototype.forEach.call(colorBody.querySelectorAll('.cmp-item'), function (el) {
          el.addEventListener('click', function () {
            cmpSel = el.getAttribute('data-role'); cmpPath = [0]; tabComp();
          });
        });

        Array.prototype.forEach.call(colorBody.querySelectorAll('[data-act]'), function (b) {
          b.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var act = b.getAttribute('data-act'), role = b.getAttribute('data-role');

            if (act === 'mode') {
              cmpMode = b.getAttribute('data-m') || 'tree';
              cmpPath = [0]; tabComp(); return;
            }

            if (act === 'hide') {
              if (overrides.hidden[role]) delete overrides.hidden[role];
              else overrides.hidden[role] = true;
              saveOverrides(); buildModules(); tabComp();
              toast(overrides.hidden[role] ? '已从左栏隐藏，稿子里写了照样渲染' : '已恢复显示');
            } else if (act === 'reset') {
              delete overrides.tpl[role]; delete overrides.item[role];
              delete overrides.tree[role];
              saveOverrides(); render(); tabComp(); toast('已恢复默认模板（元素改动一并清除）');
            } else if (act === 'del') {
              if (!window.confirm('删除自建组件「' + roleName(role) + '」？\n'
                + '稿子里的 :::' + role + ' 会降级成普通段落。')) return;
              delete overrides.modules[role]; delete overrides.tpl[role]; delete overrides.item[role];
              delete overrides.hidden[role];   // 组件都没了，隐藏标记留着只会误伤导出
              // 主题自带的也要删，否则下一轮 sync 又会把它注册回来
              var bt = themes[themeSel.value];
              if (bt && bt.modules && bt.modules[role]) delete bt.modules[role];
              saveOverrides(); syncCustomModules(); buildModules();
              cmpSel = compRoles()[0] || null; tabComp(); render();
              toast('已删除 :::' + role);
            }
          });
        });

        /* ---------- 元素树的交互 ---------- */
        Array.prototype.forEach.call(colorBody.querySelectorAll('.etree .enode'), function (el) {
          el.addEventListener('click', function () {
            cmpPath = (el.getAttribute('data-path') || '0').split('.').map(Number);
            tabComp();
          });
        });
        var tk = $('tkSel');
        if (tk) tk.addEventListener('change', function () {
          cmpTreeKey = tk.value; cmpPath = [0]; tabComp();
        });

        var props = $('eprops');
        if (props) {
          // 样式值：改完立即写树 + 重渲染全文预览（不重绘面板，否则输入框会掉焦点）
          props.addEventListener('input', function (e) {
            var el = e.target, k = el.getAttribute('data-k');
            if (k == null) return;
            var val = el.value;
            if (el.classList.contains('ep-px')) val = val + (el.getAttribute('data-u') || 'px');
            writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
              n.style = n.style || {};
              n.style[k] = val;
              if (!n.style.__order) n.style.__order = Object.keys(n.style).filter(function (x) { return x.indexOf('__') !== 0; });
              if (n.style.__order.indexOf(k) < 0) n.style.__order.push(k);
            });
          });
          props.addEventListener('change', function (e) {
            var el = e.target, k = el.getAttribute('data-k');
            if (k == null) return;
            if (el.classList.contains('ep-color')) return;    // color 已在 input 里处理过
            writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
              n.style = n.style || {};
              n.style[k] = el.value;
              if (!n.style.__order) n.style.__order = Object.keys(n.style).filter(function (x) { return x.indexOf('__') !== 0; });
              if (n.style.__order.indexOf(k) < 0) n.style.__order.push(k);
            });
          });

          Array.prototype.forEach.call(props.querySelectorAll('.ep-field'), function (el) {
            el.addEventListener('change', function () {
              var f = el.getAttribute('data-f'), v = el.value;
              writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
                if (f === 'if') {
                  var arr = v.split(/[,，\s]+/).filter(Boolean);
                  if (!arr.length) delete n.if;
                  else n.if = arr.length === 1 ? arr[0] : arr;
                } else {
                  n[f] = v;
                }
              });
              tabComp();
            });
          });
          var typeSel = props.querySelector('.ep-type');
          if (typeSel) typeSel.addEventListener('change', function () {
            writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) { n.type = typeSel.value; });
            tabComp();
          });

          // 注意：这里必须用 data-eact 而不是 data-act。
          // bindComp 给所有 [data-act] 都绑了处理器并调用了 stopPropagation()，
          // 面板里的按钮若也用 data-act，事件冒泡不到这里 —— 症状是「按钮点了没反应」。
          props.addEventListener('click', function (e) {
            var b = e.target.closest('button[data-eact], button.ep-delst');
            if (!b) return;
            var act = b.getAttribute('data-eact');

            if (b.classList.contains('ep-delst')) {
              var k2 = b.getAttribute('data-k');
              writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
                if (!n.style) return;
                delete n.style[k2];
                var o = n.style.__order || [];
                var j = o.indexOf(k2); if (j >= 0) o.splice(j, 1);
              });
              tabComp(); return;
            }
            if (act === 'addstyle') {
              var nk = props.querySelector('.ep-newkey');
              if (!nk) return;
              writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
                n.style = n.style || {};
                if (n.style[nk.value] !== undefined) return;
                n.style[nk.value] = '';
                if (!n.style.__order) n.style.__order = Object.keys(n.style).filter(function (x) { return x.indexOf('__') !== 0; });
                n.style.__order.push(nk.value);
              });
              tabComp(); return;
            }
            if (act === 'addchild') {
              var nt = props.querySelector('.ep-newtype');
              if (!nt) return;
              writeNode(cmpSel, cmpTreeKey, cmpPath, function (n) {
                n.children = n.children || [];
                var kid = { type: nt.value };
                if (kid.type === 'text') { kid.text = '新文字'; kid.style = emptyStyle(); }
                else if (kid.type === 'image') { kid.src = '{{src}}'; kid.style = emptyStyle(); }
                else if (kid.type === 'slot') kid.name = 'content';
                else if (kid.type === 'html') kid.html = '';
                else kid.style = emptyStyle();
                n.children.push(kid);
              });
              tabComp(); return;
            }
            if (act === 'delnode') {
              writeNode(cmpSel, cmpTreeKey, cmpPath, function (n, slot) {
                slot.list.splice(slot.idx, 1);
              });
              cmpPath = [0]; tabComp(); return;
            }
          });
        }

        var ta = $('cmpTpl');
        if (ta) ta.addEventListener('input', function () {
          overrides.tpl[cmpSel] = ta.value;
          delete overrides.tree[cmpSel];      // 源码改了就让元素树失效，否则「改了没反应」
          saveOverrides();
          checkAndPreview(cmpSel); render();
        });
        var ti = $('cmpItem');
        if (ti) ti.addEventListener('input', function () {
          overrides.item[cmpSel] = ti.value; saveOverrides();
          checkAndPreview(cmpSel); render();
        });

        var nb = $('cmpNewBtn');
        if (nb) nb.addEventListener('click', function () {
          var box = $('cmpNewBox');
          if (!box) return;
          box.classList.toggle('show');
          if (box.classList.contains('show') && $('ncName')) $('ncName').focus();
        });
        var ncCancel = $('ncCancel');
        if (ncCancel) ncCancel.addEventListener('click', function () {
          $('cmpNewBox').classList.remove('show');
        });
        var ncOk = $('ncOk');
        if (ncOk) ncOk.addEventListener('click', createCmp);
      }

      function cmpNewFormHTML() {
        var src = [];
        Object.keys(window.GZH.MODULES || {}).forEach(function (r) {
          var m = window.GZH.MODULES[r];
          if (m.__custom) return;
          src.push('<option value="' + r + '">' + escHtml((m.ui && m.ui.label) || r) + '（' + r + '）</option>');
        });
        return '<div class="row"><span>组件名</span><input type="text" id="ncName" placeholder="结论卡"></div>'
          + '<div class="row"><span>语法名</span><input type="text" id="ncRole" placeholder="verdict"></div>'
          + '<em>稿子里写成 :::verdict … :::；只能用小写字母开头。不能和内置组件重名。</em>'
          + '<div class="row"><span>内容怎么取</span><select id="ncKind">'
          + '<option value="whole">整段正文（多数情况选这个）</option>'
          + '<option value="kv">字段行 —— 盒子里写 key: value 当字段</option>'
          + '<option value="list">列表 —— 每个 - 一行渲染成一条</option>'
          + '</select></div>'
          + '<div class="row"><span>复制谁当起点</span><select id="ncFrom">' + src.join('') + '</select></div>'
          + '<em>挑一个长得最接近的，建好以后在上面随便改。</em>'
          + '<div class="row" style="margin-left:84px;">'
          + '<button class="mini" id="ncOk">创建</button>'
          + '<button class="mini" id="ncCancel">取消</button></div>';
      }

      function createCmp() {
        var name = (($('ncName') && $('ncName').value) || '').trim();
        var role = (($('ncRole') && $('ncRole').value) || '').trim().toLowerCase()
          .replace(/[^a-z0-9_-]/g, '');
        var kind = $('ncKind') && $('ncKind').value;
        var from = $('ncFrom') && $('ncFrom').value;

        if (!role) { toast('语法名必填：小写字母，稿子里写成 :::名字'); return; }
        if (!/^[a-z]/.test(role)) { toast('语法名要用小写字母开头'); return; }
        if (window.GZH.MODULES[role] && !window.GZH.MODULES[role].__custom) {
          toast('「' + role + '」是内置组件，换一个名字'); return;
        }

        var t = themes[themeSel.value] || {};
        var srcComp = (t.components && t.components[from]) || null;
        overrides.modules[role] = { name: name || role, group: '正文', kind: kind, from: from };
        // 起点的样子要抄过来 —— 有元素树就抄树（新组件立刻可逐项编辑），
        // 没有就退回抄 HTML 字符串；两者 render 都会认。
        var srcTree = t.compositions && t.compositions[from] && t.compositions[from].tree;
        if (srcTree) overrides.tree[role] = { tree: srcTree };
        else if (srcComp && srcComp.tpl) overrides.tpl[role] = srcComp.tpl;
        if (srcComp && srcComp.item) overrides.item[role] = srcComp.item;

        saveOverrides(); syncCustomModules(); buildModules();
        cmpSel = role; tabComp(); render();
        toast('已建好 :::' + role + ' —— 左栏「正文」组里可以直接插入，模板在上面改');
      }

      /* 模板体检：把微信的红线和两个「最容易改坏」的地方当场指出来，
       * 免得你粘进公众号才发现。 */
      var WECHAT_BAN = [
        ['<div', '&lt;div&gt; —— 微信一律过滤，容器只能用 &lt;section&gt;'],
        ['class=', 'class 属性 —— 微信会擦掉，样式必须内联'],
        ['id=', 'id 属性 —— 同上'],
        ['position:', 'position 定位 —— 微信不支持'],
        ['float:', 'float 浮动 —— 微信不支持'],
        ['<script', '&lt;script&gt; 标签'],
        ['<iframe', '&lt;iframe&gt; 标签'],
        ['<style', '&lt;style&gt; 标签']
      ];

      function checkTpl(s) {
        var bad = [], warn = [];
        WECHAT_BAN.forEach(function (p) {
          if (s.indexOf(p[0]) >= 0) bad.push(p[1]);
        });
        // 模板里出现 {{title}} 是正常的，本就不该报警；
        // 真正要拦的是**括号写残了**（{{title} / {{?x}）——那种 fill() 匹配不上，
        // 会原样印到正文里。所以这条查的是「单个右括号」而不是「有没有 {{」。
        if (/\{\{\/?\w+\}(?!\})/.test(s)) {
          bad.push('模板括号写残了（形如 <code>{{title}</code>）—— 少一个右括号，'
            + '变量就不会被替换，会原样出现在正文里');
        }
        var grad = (s.match(/135deg/g) || []).length;
        if (grad) warn.push(grad + ' 处 135° 渐变 —— 微信深色模式下卡片里的字可能变淡');
        if (!/<section/.test(s)) warn.push('没有 <code>&lt;section&gt;</code> —— 微信的布局容器，缺了间距会串');
        var bare = s.match(/<(p|h[1-6])\b[^>]*>(?:(?!<span)[\s\S])*?[^\s<][\s\S]*?<\/\1>/);
        if (bare && bare[0].indexOf('<span') < 0) {
          warn.push('有文字没包进 <code>&lt;span leaf=""&gt;</code> —— 粘贴后可能被编辑器擦掉');
        }

        var html = '';
        if (bad.length) {
          html = '<b style="color:#991b1b;">微信会拦：</b><ul>'
            + bad.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
        }
        if (warn.length) {
          html += '<b style="color:#92400e;">留意：</b><ul>'
            + warn.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
        }
        if (!bad.length && !warn.length) html = '<span style="color:#065f46;">✓ 没发现微信红线</span>';
        return html;
      }

      /* 两种体检都要给用户看，缺一不可：
       *   模板红线 —— 编辑当下就能发现（<div>、class、裸文字）
       *   渲染结果 —— 语法没错但产物踩线的情况（比如最后一个 leaf span 被删光了）
       * 曾经写成后者覆盖前者，结果「写了 <div> 却不报警」。 */
      function checkAndPreview(role) {
        previewComp(role);
        var box = $('cmpMsg');
        if (!box) return;
        var src = cmpMode === 'src'
          ? (($('cmpTpl') && $('cmpTpl').value) || '')
          : window.GZH.treeTpl(treeOf(role, cmpTreeKey));
        var tplMsg = src ? checkTpl(src) : '';
        if (tplMsg) box.innerHTML = tplMsg + box.innerHTML;
      }

      /* 用一个样例 block 渲染这一个组件 —— 比看 HTML 直观得多。
       * 样例内容直接取注册表里的 snippet，所以「这个盒子在稿子里怎么用」也是现成的示范。 */
      function previewComp(role) {
        var el = $('cmpPrev');
        if (!el) return;

        var t = JSON.parse(JSON.stringify(currentTheme() || themes[themeSel.value]));

        if (cmpMode === 'src') {
          // 源码模式下必须把元素树移走，否则 pickComp 会优先取 compositions，
          // 表现就是「我明明改了源码，预览纹丝不动」。
          if (t.compositions) delete t.compositions[role];
          t.components = t.components || {};
          t.components[role] = t.components[role] || {};
          t.components[role].tpl = ($('cmpTpl') && $('cmpTpl').value) || '';
          if ($('cmpItem')) t.components[role].item = $('cmpItem').value;
        }

        var m = window.GZH.MODULES && window.GZH.MODULES[role];
        var md = (m && m.ui && m.ui.snippet) || '';
        try {
          var ir = md ? window.GZH.toIR(window.GZH.parse(md)) : null;
          var blk = null;
          ((ir && ir.blocks) || []).forEach(function (b) {
            if (!blk && b.role === role) blk = b;
          });
          if (!blk) {
            el.innerHTML = '<div class="cmp-prev-empty">这个组件没有样例内容 —— '
              + '改完看右侧全文预览就行。</div>';
            return;
          }
          el.innerHTML = window.GZH.renderBlock(t, blk);
          checkCompHealth(el.innerHTML, t);
        } catch (e) {
          el.innerHTML = '<div class="cmp-prev-empty" style="color:#991b1b;">预览失败：'
            + escHtml(e.message) + '</div>';
        }
      }

      /* 光查模板字符串不够 —— 真正常见的问题是「语法没错，但渲染出来踩了红线」。
       * 所以渲染完再对结果跑一遍体检规则（theme.rules），这才是口径一致的判官。 */
      function checkCompHealth(html, theme) {
        var box = $('cmpMsg');
        if (!box) return;
        var v = window.GZH.verdict(window.GZH.metrics(html), (theme && theme.rules) || {});
        if (v.ok) {
          box.innerHTML = '<span style="color:#065f46;">✓ 渲染结果没踩红线</span>';
        } else {
          box.innerHTML = '<b style="color:#92400e;">渲染结果：</b><ul>'
            + v.issues.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>';
        }
      }

      function suggestId() {
        var base = themeSel.value || 'theme';
        return base + '-custom';
      }
      function suggestName() {
        var t = currentTheme();
        return (t && t.name ? t.name : '主题') + '（自定义）';
      }

      // 「重置本页」只清当前页签那一类改动 —— 改坏了色没必要把建好的组件一起赔进去
      function resetColor() {
        if (curTab === 'scale') overrides.base = {};
        else if (curTab === 'comp') {
          overrides.tpl = {}; overrides.item = {}; overrides.modules = {};
          overrides.hidden = {}; overrides.tree = {};
        }
        else overrides.tokens = {};
        saveOverrides(); syncCustomModules(); buildModules(); render();
        openColor(curTab);
        toast('已恢复「' + ((currentTheme() || {}).name || '') + '」本页的原始设置');
      }

      /* 导出的是一个「放进 themes/ 就能用」的 .js 文件，格式与
       * check/build_theme_js.py 的产物一致 —— 拿到的人不需要装 Python 重新编译。
       * 内容用全量快照而不是只存 diff：分享出去的主题必须自包含，
       * 不能假设对方机器上还有原来那套。 */
      function exportTheme() {
        var t = currentTheme();
        if (!t) { toast('先选一个主题'); return; }

        var id = ($('newThemeId') && $('newThemeId').value.trim()) || suggestId();
        var name = ($('newThemeName') && $('newThemeName').value.trim()) || suggestName();
        id = id.replace(/[^a-zA-Z0-9_-]/g, '-');

        var out = JSON.parse(JSON.stringify(t));
        out.id = id;
        out.name = name;

        /* 四类改动落进主题的位置各不相同，这里逐个固化：
         *   tokens/base/tpl/item → currentTheme() 已经写进 out 了
         *   modules（自建组件） → 要额外带出去，否则别人导入后 :::verdict 只是个普通段落
         *   hidden（隐藏的组件）→ 从 components 里删掉，这套主题就当它不存在 */
        Object.keys(effectiveModules()).forEach(function (role) {
          out.components = out.components || {};
          // 自建组件没有"主题自带的模板"，但模板必须跟着走，否则渲染会退回内置兜底、
          // 看起来跟你改的不一样
          out.components[role] = out.components[role] || {};
          out.components[role].tpl = tplOf(role);
          if (itemOf(role)) out.components[role].item = itemOf(role);
        });
        if (Object.keys(effectiveModules()).length) out.modules = effectiveModules();
        Object.keys(overrides.hidden || {}).forEach(function (role) {
          // 自建组件不受隐藏影响：那是你亲手造的，导出就该带着
          if (out.components && !effectiveModules()[role]) delete out.components[role];
        });

        var changed = [];
        if (Object.keys(overrides.tokens).length) changed.push('配色');
        if (Object.keys(overrides.base).length) changed.push('尺度');
        if (Object.keys(overrides.tpl).length || Object.keys(overrides.item).length) changed.push('模板');
        if (Object.keys(effectiveModules()).length) changed.push('自建组件');
        if (Object.keys(overrides.hidden).length) changed.push('隐藏了组件');
        out.derivedFrom = (themeSel.value || '') + (changed.length ? '（改过' + changed.join('/') + '）' : '');
        out.note = '由 App 主题编辑面板导出。放进 themes/ 目录刷新即可，无需编译。';

        // 自己这套立刻可用：注册进 GZH_THEMES 并写进 localStorage，刷新后还在下拉里。
        // （不能只靠「丢进 themes/ 目录」—— 动态加载看的是 GZH_THEME_ORDER，
        //   而它是编译产物，不含手工放进去的文件。）
        window.GZH_THEMES[id] = out;
        var extras = extraIds();
        if (extras.indexOf(id) < 0) extras.push(id);
        lsSet(LS_THEME + id, JSON.stringify(out));
        lsSet(LS_EXTRA, JSON.stringify(extras));

        buildThemeOptions();
        themeSel.value = id;
        overrides = { tokens: {}, base: {}, tpl: {}, item: {}, modules: {}, hidden: {}, tree: {} };  // 改动已固化进新主题
        saveOverrides(); syncCustomModules(); buildModules();
        render();

        // 下载的这份是给别人的：对方用「导入主题」打开即可，不用装 Python 重编译
        var js = '/* 自动生成，请勿手改。由 App 配色面板导出 */\n'
          + '(function(g){\n'
          + '  g.GZH_THEMES = g.GZH_THEMES || {};\n'
          + "  g.GZH_THEMES['" + id + "'] = "
          + JSON.stringify(out, null, 2) + ';\n'
          + '})(window);\n';

        var blob = new Blob([js], { type: 'application/javascript' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = id + '.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        toast('已存为「' + name + '」并在下拉里选中；' + id + '.js 也下载了，发给朋友用「导入主题」打开');
      }

      /* 导入：既能吃导出的 .js，也能吃源 .json。
       * .js 是固定格式的 IIFE，直接跑一次就会把自己注册进 GZH_THEMES。 */
      function importTheme(text, fname) {
        var before = Object.keys(window.GZH_THEMES || {});
        try {
          if (/\.json$/i.test(fname) || /^\s*\{/.test(text)) {
            var obj = JSON.parse(text);
            if (!obj || !obj.id) throw new Error('缺少 id 字段');
            window.GZH_THEMES[obj.id] = obj;
          } else {
            (new Function(text))();
          }
        } catch (e) {
          toast('这个文件读不了：' + e.message);
          return;
        }

        var added = Object.keys(window.GZH_THEMES).filter(function (k) {
          return before.indexOf(k) < 0;
        });
        if (!added.length) { toast('文件里没有新主题'); return; }

        var extras = extraIds();
        added.forEach(function (id) {
          if (extras.indexOf(id) < 0) extras.push(id);
          lsSet(LS_THEME + id, JSON.stringify(window.GZH_THEMES[id]));
        });
        lsSet(LS_EXTRA, JSON.stringify(extras));

        buildThemeOptions();
        themeSel.value = added[added.length - 1];
        loadOverrides(themeSel.value);   // 你自己导出过的改动会跟着回来
        buildModules();
        render();
        toast('已导入「' + (window.GZH_THEMES[themeSel.value].name || themeSel.value) + '」');
      }

      $('colorBtn').addEventListener('click', function () { openColor(curTab); });
      $('colorClose') && $('colorClose').addEventListener('click', closeColor);
      colorMask.addEventListener('click', function (e) { if (e.target === colorMask) closeColor(); });
      Array.prototype.forEach.call($('colorTabs').querySelectorAll('.tab'), function (b) {
        b.addEventListener('click', function () { openColor(b.getAttribute('data-tab')); });
      });
      $('colorReset').addEventListener('click', resetColor);
      $('colorExport').addEventListener('click', exportTheme);
      $('colorImport').addEventListener('click', function () { $('themeFile').click(); });
      $('themeFile').addEventListener('change', function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var r = new FileReader();
        r.onload = function () { importTheme(String(r.result), file.name); };
        r.onerror = function () { toast('读文件失败'); };
        r.readAsText(file);
        ev.target.value = '';
      });

      /* ============================================================
       * 发布到公众号草稿箱
       *
       * 为什么不能直接在页面里 fetch 微信：
       *   api.weixin.qq.com 不返回 Access-Control-Allow-Origin，浏览器会直接拦掉
       *   （file:// 页面 origin 是 null，更严格）。所以请求必须先经过本机那个
       *   零依赖代理（tools/wechat-proxy.js），由它补 CORS 头再转发。
       *   代理只监听 127.0.0.1，且只能转发到 api.weixin.qq.com。
       *
       * 密钥存哪：localStorage（file:// 实测可写）。**不写进导出主题、不上传任何第三方。**
       * 这是权衡后的选择 —— 公众号后台的 IP 白名单 + 本机代理已经把风险压到很小，
       * 但 AppSecret 仍然是明文存在浏览器里，所以面板里给了「清除密钥」。
       * ============================================================ */
      var LS_PUB = 'gzh.publish';

      var pubCfg = (function () {
        try { return JSON.parse(lsGet(LS_PUB) || '{}') || {}; } catch (e) { return {}; }
      })();
      function savePub() { lsSet(LS_PUB, JSON.stringify(pubCfg)); }

      /* ---------- 正文图片映射 ----------
       * 微信草稿正文只认自己域下的图片（mmbiz.qpic.cn）。占位图是 base64 data URI，
       * 外链图也不保证显示 —— 正文里的图必须先传进公众号，拿到微信 URL 再替换掉。
       *
       * 上传结果按「图片内容」记一张映射表存 localStorage：
       *   同一个占位图不用重复传，之后每次重渲染也自动套回微信 URL。 */
      var LS_IMGMAP = 'gzh.imgmap';
      var imgMap = (function () {
        try { return JSON.parse(lsGet(LS_IMGMAP) || '{}') || {}; } catch (e) { return {}; }
      })();
      function saveImgMap() { lsSet(LS_IMGMAP, JSON.stringify(imgMap)); }

      // data URI 动辄几万字节，整条当 key 会把 localStorage 撑爆 —— 取首尾片段 + 长度
      function imgKey(src) {
        if (!src) return '';
        if (src.length <= 128) return src;
        return src.slice(0, 64) + '#' + src.length + '#' + src.slice(-24);
      }

      function applyImgMap(html) {
        if (!html) return html;
        if (!Object.keys(imgMap).length) return html;
        return html.replace(/<img([^>]*?)\ssrc="([^"]+)"/g, function (m, pre, src) {
          var wx = imgMap[imgKey(src)];
          return wx ? '<img' + pre + ' src="' + wx + '"' : m;
        });
      }

      // 把正文里的 <img src> 全扫一遍，按「能不能直接发」分类
      function scanImgs(html) {
        var out = [], seen = {};
        (html.match(/<img[^>]*\ssrc="[^"]+"/g) || []).forEach(function (tag) {
          var m = tag.match(/\ssrc="([^"]+)"/);
          if (!m) return;
          var src = m[1];
          if (seen[src]) return;
          seen[src] = 1;
          var kind = /^data:image\//i.test(src) ? 'base64'
            : /^https?:\/\/(mmbiz|res\.wx)\./i.test(src) ? 'wx'
              : /^https?:\/\//i.test(src) ? 'remote' : 'other';
          out.push({ src: src, kind: kind });
        });
        return out;
      }

      function dataURItoBlob(uri) {
        var m = String(uri).match(/^data:([^;,]+)(;base64)?,([\s\S]*)$/);
        if (!m) return null;
        var bin;
        try { bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); }
        catch (e) { return null; }
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: m[1] || 'image/png' });
      }

      var pubMask = $('pubMask'), pubBody = $('pubBody');

      // 微信常见 errcode → 人话。尤其 40164（IP 白名单）必须先讲清楚，
      // 否则用户只会看到「invalid ip」，根本不知道要去后台加白名单。
      var WX_ERR = {
        40001: 'access_token 无效或已过期 —— 重新点「测试连接」取一个',
        40013: 'AppID 不对 —— 去公众号后台「基本配置」核对',
        40014: 'access_token 不合法',
        40125: 'AppSecret 不对 —— 去公众号后台「基本配置」重置或核对',
        40164: '调用方 IP 不在白名单 —— 把上面那个「本机公网 IP」加进公众号后台「设置与开发 › 基本配置 › IP白名单」',
        41001: '缺少 access_token',
        45009: '接口调用超过限额（草稿接口每天有限额）',
        48001: 'API 功能未授权 —— 订阅号/未认证号很多接口没有权限',
        53404: '账号已被限制调用该接口',
        45001: '多媒体文件超过大小限制',
        40007: '无效的 media_id —— 封面素材不存在或不是永久素材'
      };
      function wxErrText(data) {
        if (!data || data.errcode === undefined || data.errcode === 0) return '';
        var known = WX_ERR[data.errcode];
        return 'errcode ' + data.errcode + '：' + (known || data.errmsg || '未知错误')
          + (known ? '' : '（' + (data.errmsg || '') + '）');
      }

      function proxyBase() {
        return (pubCfg.proxy || 'http://127.0.0.1:8787').replace(/\/+$/, '');
      }

      // 统一的代理请求。代理没起时给出可操作的提示，而不是让用户面对一个 fetch 报错。
      function wxApi(path, query, body, cb) {
        var url = proxyBase() + '/wx/' + path + (query ? '?' + query : '');
        var opt = { method: body ? 'POST' : 'GET' };
        if (body) {
          if (body instanceof FormData) opt.body = body;                       // 素材上传（带 boundary）
          else { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
        }
        fetch(url, opt).then(function (r) {
          return r.text().then(function (t) {
            var d = null;
            try { d = JSON.parse(t); } catch (e) { d = { raw: t }; }
            cb(null, d);
          });
        }).catch(function (e) {
          cb(new Error('连不上本机代理（' + proxyBase() + '）。先在项目目录跑：node tools/wechat-proxy.js'
            + '　—— 浏览器不能直连微信 API，必须走这层。'));
        });
      }

      function proxyGet(path, cb) {
        fetch(proxyBase() + path).then(function (r) { return r.json(); })
          .then(function (d) { cb(null, d); })
          .catch(function (e) { cb(new Error('连不上本机代理（' + proxyBase() + '）。先跑：node tools/wechat-proxy.js')); });
      }

      function pubStatus(html, kind) {
        var el = $('pubStatus');
        if (el) el.innerHTML = '<div class="pub-note ' + (kind || '') + '">' + html + '</div>';
      }

      function openPub() {
        var t = currentTheme();
        pubBody.innerHTML = ''
          // ① 代理
          + '<div class="crow"><span class="crow-k"><b>本机代理</b>'
          + '<em>浏览器不能直连微信 API，必须走这层。在项目目录跑：<code>node tools/wechat-proxy.js</code></em></span>'

          + '<div class="crow"><span class="crow-k"><b>AppSecret</b>'

          + '<button id="pubEye" class="mini">显示</button></div>'

          // ④ 稿件字段
          + '<div class="crow"><span class="crow-k"><b>作者</b><em>留空则取稿子里 :::profile 的 author</em></span>'
          + '<input type="text" id="pubAuthor" style="width:210px" value="' + (pubCfg.author || '') + '"></div>'
          + '<div class="crow"><span class="crow-k"><b>原文链接</b><em>可选，文末「阅读原文」</em></span>'
          + '<input type="text" id="pubSrcUrl" style="width:210px" value="' + (pubCfg.sourceUrl || '') + '" placeholder="https://"></div>'
          + '<div class="crow"><span class="crow-k"><b>摘要</b><em>可选，留空微信会自动截取</em></span>'
          + '<input type="text" id="pubDigest" style="width:210px" value="' + (pubCfg.digest || '') + '"></div>'

          // ⑤ 封面（草稿接口必填 thumb_media_id）
          + '<div class="crow"><span class="crow-k"><b>封面 media_id</b>'
          + '<em>草稿接口必填。必须是素材库里的<b>永久图片</b>素材</em></span>'
          + '<input type="text" id="pubThumb" style="width:210px" value="' + (pubCfg.thumbMediaId || '') + '" placeholder="还没选">'
          + '<button id="pubPick" class="mini">从素材库选</button>'
          + '<button id="pubUpload" class="mini">上传一张</button></div>'

          // ⑥ 正文图片（草稿只认微信自家的图片地址）
          + '<div class="crow"><span class="crow-k"><b>正文图片</b>'
          + '<em>微信草稿不认 base64 占位图。点「上传并替换」把正文里的图传进公众号，自动换成微信 URL；'
          + '传过一次的图会记住，以后重渲染直接套用</em></span>'
          + '<code class="crow-v" id="pubImgStat" style="min-width:150px;">—</code>'
          + '<button id="pubImgUpload" class="mini">上传并替换</button>'
          + '<button id="pubImgMap" class="mini">清除映射</button></div>'
          + '<div class="crow"><span class="crow-k"><b>存入素材库</b>'
          + '<em>默认走「正文图片」接口：不占素材库张数配额，但后台素材库里看不到；'
          + '勾上则传成永久素材（占配额，可在素材库翻到、可复用）</em></span>'
          + '<label class="crow-v" style="display:flex;align-items:center;gap:6px;font-size:12px;">'
          + '<input type="checkbox" id="pubImgMaterial"' + (pubCfg.imgToMaterial ? ' checked' : '') + '> 传成永久素材</label></div>'

          + '<div id="pubStatus"></div>'
          + '<div class="pub-help">'
          + '<b>三个前提，缺一不可：</b>'
          + '① 公众号是<b>认证</b>的服务号/订阅号（未认证号没有草稿接口权限）；'
          + '② 本机公网 IP 已加进<b>IP 白名单</b>；'
          + '③ AppID / AppSecret 填对。'
          + '<br><b>正文图片：</b>占位图是 base64 内嵌图，微信认不了，发之前先点「上传并替换」。'
          + '默认走图文消息内图片接口（不占素材库配额），勾上「传成永久素材」才会进素材库。'
          + '<br>代理只在你需要发稿时开着，不发稿可以关掉（Ctrl+C）。'
          + '</div>';

        bindPub(t);
        pubMask.classList.add('show');
      }

      function bindPub(t) {
        function readCfg() {
          pubCfg.proxy = $('pubProxy').value.trim();
          pubCfg.appId = $('pubAppId').value.trim();
          pubCfg.appSecret = $('pubSecret').value;
          pubCfg.author = $('pubAuthor').value.trim();
          pubCfg.sourceUrl = $('pubSrcUrl').value.trim();
          pubCfg.digest = $('pubDigest').value.trim();
          pubCfg.thumbMediaId = $('pubThumb').value.trim();
          savePub();
        }
        ['pubProxy', 'pubAppId', 'pubSecret', 'pubAuthor', 'pubSrcUrl', 'pubDigest', 'pubThumb']
          .forEach(function (id) {
            var el = $(id);
            if (el) el.addEventListener('change', readCfg);
          });

        $('pubPing').addEventListener('click', function () {
          readCfg();
          proxyGet('/health', function (err, d) {
            pubStatus(err ? err.message
              : '代理正常 ✓（转发目标 ' + (d && d.upstream) + '）', err ? 'bad' : 'good');
          });
        });

        $('pubIpBtn').addEventListener('click', function () {
          pubStatus('正在查…');
          proxyGet('/ip', function (err, d) {
            if (err) { pubStatus(err.message, 'bad'); return; }
            if (d && d.ip) {
              pubCfg.lastIp = d.ip; savePub();
              $('pubIp').textContent = d.ip;
              pubStatus('你的公网出口 IP 是 <b>' + d.ip + '</b>。去公众号后台「设置与开发 › 基本配置 › IP白名单」'
                + '把它加进去，<b>保存后等 1 分钟</b>再回来测试连接。', 'good');
            } else pubStatus('没取到 IP：' + ((d && d.error) || '未知'), 'bad');
          });
        });

        $('pubIpCopy').addEventListener('click', function () {
          var ip = $('pubIp').textContent.trim();
          if (!ip || ip === '未获取') { pubStatus('先点「查 IP」', 'bad'); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ip).then(function () { pubStatus('已复制 ' + ip, 'good'); })
              .catch(function () { pubStatus('复制失败，手动选中复制', 'bad'); });
          } else pubStatus('当前环境不支持一键复制，手动选中复制', 'bad');
        });

        $('pubEye').addEventListener('click', function () {
          var el = $('pubSecret');
          el.type = el.type === 'password' ? 'text' : 'password';
          this.textContent = el.type === 'password' ? '显示' : '隐藏';
        });

        $('pubUpload').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          $('thumbFile').click();
        });

        $('pubPick').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          pubStatus('正在取素材列表…');
          getToken(function (err, token) {
            if (err) { pubStatus(err.message || err, 'bad'); return; }
            wxApi('cgi-bin/material/batchget_material', 'access_token=' + encodeURIComponent(token),
              { type: 'image', offset: 0, count: 20 }, function (e2, d) {
                if (e2) { pubStatus(e2.message, 'bad'); return; }
                var bad = wxErrText(d);
                if (bad) { pubStatus(bad, 'bad'); return; }
                var items = (d && d.item) || [];
                if (!items.length) { pubStatus('素材库里还没有图片素材，先点「上传一张」', 'bad'); return; }
                var html = '<div class="pub-pick">点击选一张当封面：<div class="pub-pick-list">';
                items.forEach(function (it) {
                  html += '<div class="pub-pick-item" data-id="' + it.media_id + '" title="' + (it.name || '') + '">'
                    + '<img src="' + it.url + '"><span>' + (it.name || it.media_id) + '</span></div>';
                });
                html += '</div></div>';
                pubStatus(html, 'good');
                Array.prototype.forEach.call(pubBody.querySelectorAll('.pub-pick-item'), function (el) {
                  el.addEventListener('click', function () {
                    $('pubThumb').value = el.getAttribute('data-id');
                    pubCfg.thumbMediaId = el.getAttribute('data-id'); savePub();
                    pubStatus('已选封面 media_id：<code>' + el.getAttribute('data-id') + '</code>', 'good');
                  });
                });
              });
          });
        });

        $('pubImgUpload').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          if ($('pubImgMaterial')) { pubCfg.imgToMaterial = $('pubImgMaterial').checked; savePub(); }
          replaceArticleImgs();
        });

        $('pubImgMap').addEventListener('click', function () {
          var n = Object.keys(imgMap).length;
          if (!n) { pubStatus('映射表是空的 —— 还没上传过图片', 'bad'); return; }
          if (!window.confirm('清除已记住的 ' + n + ' 张图片地址？\n之后重渲染会退回 base64 占位图，需要重新上传。')) return;
          imgMap = {}; saveImgMap();
          render(); refreshImgStat();
          pubStatus('已清除 ' + n + ' 条图片映射', 'good');
        });

        if ($('pubImgMaterial')) $('pubImgMaterial').addEventListener('change', function () {
          pubCfg.imgToMaterial = this.checked; savePub();
        });

        refreshImgStat();
      }

      // access_token 现取现用（7200 秒有效），不落盘 —— 落盘就要处理过期与多页面竞争
      function getToken(cb) {
        if (!pubCfg.appId || !pubCfg.appSecret) {
          cb(new Error('还没填 AppID / AppSecret')); return;
        }
        wxApi('cgi-bin/token',
          'grant_type=client_credential&appid=' + encodeURIComponent(pubCfg.appId)
          + '&secret=' + encodeURIComponent(pubCfg.appSecret), null, function (err, d) {
            if (err) { cb(err); return; }
            if (!d || !d.access_token) { cb(new Error(wxErrText(d) || '没拿到 access_token')); return; }
            cb(null, d.access_token);
          });
      }

      /* 上传一张图到公众号，换回一个能直接写进正文的 URL。
       *
       * 两条接口，差别要说清：
       *   media/uploadimg        —— 图文消息内的图片。**不占素材库配额**，
       *                            但只收 jpg/png、≤1MB，**不会出现在素材库里**。正文用这个就够。
       *   material/add_material  —— 永久素材。**占素材库张数配额**，能在后台素材库里翻到、可复用（封面就是它）。
       * 默认走前者；图超 1MB 或不是 jpg/png 时自动回退到后者（上限 10MB）。 */
      function uploadImg(src, toMaterial, cb) {
        var blob = dataURItoBlob(src);
        if (!blob) { cb(new Error('读不出这张图的二进制 —— 目前只支持正文里内嵌的 base64 图')); return; }

        var t = blob.type || 'image/png';
        var small = /(jpeg|jpg|png)/i.test(t) && blob.size <= 1024 * 1024;
        var useMaterial = !!toMaterial || !small;

        var ext = /png/i.test(t) ? 'png' : /gif/i.test(t) ? 'gif' : /webp/i.test(t) ? 'webp' : 'jpg';
        var fd = new FormData();
        fd.append('media', blob, 'gzh-' + Date.now() + '.' + ext);

        getToken(function (err, token) {
          if (err) { cb(err); return; }
          var q = 'access_token=' + encodeURIComponent(token);
          if (useMaterial) {
            wxApi('cgi-bin/material/add_material', q + '&type=image', fd, function (e, d) {
              if (e) { cb(e); return; }
              var bad = wxErrText(d);
              if (bad) { cb(new Error(bad)); return; }
              if (!d || !d.url) { cb(new Error('微信没返回 url：' + JSON.stringify(d).slice(0, 120))); return; }
              cb(null, d.url, d.media_id || '', true);
            });
          } else {
            wxApi('cgi-bin/media/uploadimg', q, fd, function (e, d) {
              if (e) { cb(e); return; }
              var bad = wxErrText(d);
              if (bad) { cb(new Error(bad)); return; }
              if (!d || !d.url) { cb(new Error('微信没返回 url：' + JSON.stringify(d).slice(0, 120))); return; }
              cb(null, d.url, '', false);
            });
          }
        });
      }

      // 面板上那一行统计：正文里到底有几张图、几张还没传
      function refreshImgStat() {
        var el = $('pubImgStat');
        if (!el) return;
        var list = scanImgs(currentHTML || '');
        // 换过地址的图 src 已经是微信 URL，得靠反查映射表才知道「这张是我们传的」
        var vals = {};
        Object.keys(imgMap).forEach(function (k) { vals[imgMap[k]] = 1; });
        var need = 0, done = 0, wx = 0, other = 0;
        list.forEach(function (it) {
          if (vals[it.src]) done++;
          else if (it.kind === 'wx') wx++;
          else if (it.kind === 'base64') need++;
          else other++;
        });
        el.textContent = list.length
          ? list.length + ' 张 · 已上传 ' + done + ' · 待上传 ' + need
          + (wx ? ' · 微信图 ' + wx : '') + (other ? ' · 外链 ' + other : '')
          : '正文里没有图片';
      }

      /* 批量上传：串行跑（并发容易撞频率限制），逐张记映射，失败的单独报出来。
       * 全部结束后把映射套回正文并重画预览 —— 体检区会立刻看到 base64 清零。 */
      function replaceArticleImgs() {
        if (!currentHTML) { pubStatus('正文还是空的', 'bad'); return; }
        var list = scanImgs(currentHTML);
        var todo = list.filter(function (it) { return it.kind === 'base64' && !imgMap[imgKey(it.src)]; });
        var other = list.filter(function (it) { return it.kind === 'remote' || it.kind === 'other'; }).length;

        if (!todo.length) {
          pubStatus('没有需要上传的图 ✓（正文共 ' + list.length + ' 张）'
            + (other ? '　注意：还有 ' + other + ' 张外链/本地图，微信不保证显示，建议手动换掉。' : ''), 'good');
          return;
        }

        var toMaterial = $('pubImgMaterial') && $('pubImgMaterial').checked;
        var i = 0, ok = 0, fails = [];

        (function step() {
          if (i >= todo.length) {
            currentHTML = applyImgMap(currentHTML);
            previewEl.innerHTML = currentHTML;
            $('statBytes').textContent = currentHTML.length.toLocaleString() + ' 字节';
            refreshImgStat();
            pubStatus('上传完成 ✓ ' + ok + '/' + todo.length + ' 张已换成微信地址'
              + (toMaterial ? '（已存入素材库）' : '（走正文图片接口，不占素材库配额）')
              + (fails.length ? '<br>失败 ' + fails.length + ' 张：' + escHtml(fails[0]) : '')
              + (other ? '<br>另有 ' + other + ' 张外链/本地图没动（微信不保证显示）' : '')
              + '<br>可以点「发送到草稿箱」了。', fails.length ? 'bad' : 'good');
            return;
          }
          var src = todo[i].src;
          pubStatus('正在上传第 ' + (i + 1) + '/' + todo.length + ' 张…（约 ' + Math.round(src.length / 1365) + ' KB）');
          uploadImg(src, toMaterial, function (err, url) {
            if (err) fails.push(err.message || String(err));
            else { imgMap[imgKey(src)] = url; saveImgMap(); ok++; }
            i++; step();
          });
        })();
      }

      function testConn() {
        readAllPub();
        pubStatus('正在取 access_token…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }
          pubStatus('连接正常 ✓ access_token 已拿到（' + token.slice(0, 10) + '…），有效期 2 小时。'
            + '可以点「发送到草稿箱」了。', 'good');
        });
      }

      function readAllPub() {
        if ($('pubProxy')) {
          pubCfg.proxy = $('pubProxy').value.trim();
          pubCfg.appId = $('pubAppId').value.trim();
          pubCfg.appSecret = $('pubSecret').value;
          pubCfg.author = $('pubAuthor').value.trim();
          pubCfg.sourceUrl = $('pubSrcUrl').value.trim();
          pubCfg.digest = $('pubDigest').value.trim();
          pubCfg.thumbMediaId = $('pubThumb').value.trim();
          savePub();
        }
      }

      /* 发送草稿
       *
       * 草稿接口有两个硬要求，都会在发送前拦住：
       *   1. thumb_media_id 必填（封面必须是素材库里的永久图片）
       *   2. 正文里的图片必须是**微信素材库的 URL**。
       *      占位图是 base64 data URI，微信不认 —— 所以先数一遍，提醒用户替换。 */
      function sendDraft() {
        readAllPub();
        if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
        if (!pubCfg.thumbMediaId) {
          pubStatus('还缺封面 media_id —— 草稿接口必填。点「上传一张」或「从素材库选」。', 'bad'); return;
        }
        if (!currentHTML) { pubStatus('正文还是空的', 'bad'); return; }

        // currentHTML 已经套过映射，这里剩下的 base64 才是真没传的
        var left = scanImgs(currentHTML).filter(function (it) { return it.kind === 'base64'; }).length;
        if (left > 0 && !window.confirm('正文里还有 ' + left + ' 张 base64 内嵌图，'
          + '微信草稿不认，发出去显示不出来。\n\n'
          + '建议先关掉这个框，点「正文图片 › 上传并替换」，传完再发。\n\n仍要直接发送吗？')) {
          pubStatus('已取消 —— 先点「正文图片 › 上传并替换」', 'bad'); return;
        }

        pubStatus('正在取 access_token…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }

          // 标题：front-matter / :::masthead 的 title，退一步取首个 # 标题，再退一步取日期
          var title = pubCfg.title || articleTitle() || ('未命名 ' + new Date().toISOString().slice(0, 10));
          var author = pubCfg.author || articleAuthor();

          pubStatus('正在提交草稿…');
          wxApi('cgi-bin/draft/add', 'access_token=' + encodeURIComponent(token), {
            articles: [{
              title: title,
              author: author,
              digest: pubCfg.digest || '',
              content: currentHTML,
              content_source_url: pubCfg.sourceUrl || '',
              thumb_media_id: pubCfg.thumbMediaId,
              need_open_comment: 0,
              only_fans_can_comment: 0
            }]
          }, function (e2, d) {
            if (e2) { pubStatus(e2.message, 'bad'); return; }
            var bad = wxErrText(d);
            if (bad) { pubStatus(bad, 'bad'); return; }
            pubCfg.lastDraftId = d.media_id; savePub();
            pubStatus('已写入草稿箱 ✓<br>标题：' + escHtml(title) + '<br>media_id：<code>' + d.media_id + '</code>'
              + '<br><a href="https://mp.weixin.qq.com/" target="_blank">打开公众号后台看草稿</a>', 'good');
          });
        });
      }

      // 从 IR 里找标题/作者：不重新解析一次 Markdown，直接复用上次渲染的 IR
      function lastIR() { return window.__gzhLastIR || null; }
      function articleTitle() {
        var ir = lastIR();
        if (!ir) return '';
        for (var i = 0; i < ir.blocks.length; i++) {
          if (ir.blocks[i].role === 'masthead' && ir.blocks[i].title) return ir.blocks[i].title;
        }
        return '';
      }
      function articleAuthor() {
        var ir = lastIR();
        if (!ir) return '';
        for (var i = 0; i < ir.blocks.length; i++) {
          var b = ir.blocks[i];
          if ((b.role === 'profile' || b.role === 'signature') && (b.author || b.account)) return b.author || b.account;
        }
        return '';
      }

      function closePub() { pubMask.classList.remove('show'); }

      $('pubBtn').addEventListener('click', openPub);
      $('pubClose').addEventListener('click', closePub);
      pubMask.addEventListener('click', function (e) { if (e.target === pubMask) closePub(); });
      $('pubTest').addEventListener('click', testConn);
      $('pubSend').addEventListener('click', sendDraft);
      $('pubClear').addEventListener('click', function () {
        if (!window.confirm('清除本机保存的 AppID / AppSecret？（封面 media_id、代理地址等配置会保留）')) return;
        pubCfg.appId = ''; pubCfg.appSecret = ''; savePub();
        if ($('pubAppId')) $('pubAppId').value = '';
        if ($('pubSecret')) $('pubSecret').value = '';
        pubStatus('已清除 AppID / AppSecret', 'good');
      });

      $('thumbFile').addEventListener('change', function (ev) {
        var file = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!file) return;
        pubStatus('正在上传封面…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }
          var fd = new FormData();
          fd.append('media', file, file.name);
          wxApi('cgi-bin/material/add_material',
            'access_token=' + encodeURIComponent(token) + '&type=image', fd, function (e2, d) {
              if (e2) { pubStatus(e2.message, 'bad'); return; }
              var bad = wxErrText(d);
              if (bad) { pubStatus(bad, 'bad'); return; }
              pubCfg.thumbMediaId = d.media_id; savePub();
              if ($('pubThumb')) $('pubThumb').value = d.media_id;
              pubStatus('封面已上传 ✓ media_id：<code>' + d.media_id + '</code>（' + escHtml(file.name) + '）', 'good');
            });
        });
      });

      loadThemeScripts(window.GZH_THEME_ORDER || [], function (missing) {
        restoreImported();
        buildThemeOptions();
        loadOverrides(themeSel.value);   // 自定义组件要在这里注册完，才能进左栏
        buildModules();
        render();
        if (missing.length) toast('有几个主题没加载到：' + missing.join('、'));
      });
    })();
  </script>
</body>

</html>
