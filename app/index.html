<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号排版 · 本地渲染</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2937;
      font-size: 14px;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand { font-size: 15px; font-weight: 600; color: #111827; }
    .brand span { color: #9ca3af; font-weight: 400; font-size: 12px; margin-left: 8px; }
    .spacer { flex: 1; }

    select, button {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
    }

    select:hover, button:hover { border-color: #9ca3af; }

    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }

    button.primary:hover { background: #1d4ed8; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ---------- 三栏：各自独立滚动 ---------- */
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 236px minmax(300px, 1fr) 470px;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    @media (max-width: 1240px) {
      main { grid-template-columns: 210px minmax(280px, 1fr) 400px; }
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .col { height: 62vh; }
    }

    .col {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .col > h2 {
      flex: 0 0 auto;
      margin: 0;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      background: #fafafa;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .col > h2 em {
      font-style: normal;
      font-weight: 400;
      color: #9ca3af;
      font-size: 11px;
    }

    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

    /* ---------- 左栏：模块面板 ---------- */
    .grp-title {
      padding: 12px 14px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: .5px;
    }

    .mod {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      padding: 8px 14px;
      background: transparent;
      cursor: pointer;
      color: #374151;
    }

    .mod:hover { background: #f3f4f6; border-left-color: #93c5fd; }
    .mod:active { background: #e5e7eb; }

    .mod b { display: block; font-size: 13px; font-weight: 500; }

    .mod code {
      display: block;
      margin-top: 3px;
      font-family: Menlo, Consolas, "Courier New", monospace;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .mod.once { border-left-color: #fbbf24; }

    /* ---------- 中栏：语法编辑 ---------- */
    textarea {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 14px 16px;
      font-family: Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.75;
      resize: none;
      outline: none;
      color: #374151;
      overflow-y: auto;
    }

    /* ---------- 右栏：预览 ---------- */
    .phone { background: #ffffff; padding: 18px 16px; }

    #preview {
      max-width: 375px;
      margin: 0 auto;
      background: #ffffff;
      word-wrap: break-word;
    }

    .checkbar {
      flex: 0 0 auto;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      max-height: 168px;
      overflow-y: auto;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px 6px;
      font-size: 12px;
    }

    .chip {
      padding: 3px 9px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #4b5563;
      font-family: Menlo, Consolas, monospace;
    }

    .chip.bad { background: #fee2e2; color: #b91c1c; }
    .chip.good { background: #dcfce7; color: #15803d; }

    #issues { padding: 0 14px 12px; }

    .issue {
      font-size: 12px;
      line-height: 1.6;
      color: #b91c1c;
      background: #fef2f2;
      border-left: 3px solid #f87171;
      padding: 6px 10px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .ok-note {
      font-size: 12px;
      color: #15803d;
      background: #f0fdf4;
      border-left: 3px solid #4ade80;
      padding: 6px 10px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .hint-note {
      font-size: 12px;
      line-height: 1.7;
      color: #92400e;
      background: #fffbeb;
      border-left: 3px solid #fbbf24;
      padding: 7px 11px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .hint-note code {
      background: #fef3c7;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: Menlo, Consolas, monospace;
    }

    /* ---------- AI 提示词弹层 ---------- */
    .mask {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, .38);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .mask.show { display: flex; }

    .modal {
      width: min(720px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }

    .modal > h3 {
      margin: 0;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal .body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.8;
      color: #374151;
    }

    .modal .body pre {
      margin: 10px 0;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal .foot {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .modal .foot .spacer { flex: 1; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: #111827;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 99;
      max-width: 76vw;
      text-align: center;
    }

    .toast.show { opacity: 1; }
    .hint { padding: 8px 14px; font-size: 12px; color: #9ca3af; line-height: 1.7; }

    .modal > h3 .xbtn {
      float: right; border: 0; background: none; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 2px; color: #9ca3af;
    }

    .crow {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid #f3f4f6;
    }
    .crow:last-child { border-bottom: 0; }
    .crow-k { flex: 1 1 auto; min-width: 0; }
    .crow-k b { display: block; font-size: 13px; font-weight: 600; color: #111827; }
    .crow-k em { display: block; font-style: normal; font-size: 11px; color: #9ca3af; }
    .crow input[type=color] {
      width: 46px; height: 30px; padding: 0; cursor: pointer;
      border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
    }
    .crow-v {
      font-family: Menlo, Consolas, monospace; font-size: 12px;
      color: #6b7280; min-width: 70px; text-align: right;
    }
    .crow-id input[type=text] {
      width: 148px; padding: 5px 8px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 6px; color: #374151;
    }
    .crow input[type=text] {
      padding: 5px 8px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 6px; color: #374151;
    }
    button.mini {
      padding: 5px 10px; font-size: 12px; border-radius: 6px;
      border: 1px solid #e5e7eb; background: #f9fafb; color: #374151;
    }
    button.mini:hover { background: #f3f4f6; }
    .pub-note {
      margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.7; background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb;
    }
    .pub-note.good { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .pub-note.bad { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .pub-note code {
      font-family: Menlo, Consolas, monospace; font-size: 11px;
      background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
    }
    .pub-help {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.8; background: #fffbeb; border: 1px solid #fde68a; color: #78350f;
    }
    .pub-pick-list {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px;
    }
    .pub-pick-item {
      cursor: pointer; border: 1px solid #e5e7eb; border-radius: 6px;
      overflow: hidden; background: #fff; text-align: center;
    }
    .pub-pick-item:hover { border-color: #2563eb; }
    .pub-pick-item img { width: 100%; height: 56px; object-fit: cover; display: block; }
    .pub-pick-item span {
      display: block; font-size: 10px; padding: 3px 4px; color: #6b7280;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- 主题编辑：三个页签 ---------- */
    .tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid #e5e7eb; }
    .tab {
      padding: 8px 14px; font-size: 13px; border: 0; background: transparent;
      color: #6b7280; border-bottom: 2px solid transparent; cursor: pointer;
    }
    .tab:hover { color: #111827; }
    .tab.on { color: #2563eb; border-bottom-color: #2563eb; font-weight: 600; }

    /* 组件编辑器：左列组件列表 + 右列模板编辑区 */
    .cmp-wrap { display: flex; gap: 12px; min-height: 430px; }
    .cmp-list {
      width: 190px; flex-shrink: 0; overflow-y: auto; max-height: 470px;
      border-right: 1px solid #e5e7eb; padding-right: 8px;
    }
    .cmp-item {
      padding: 6px 8px; font-size: 12px; border-radius: 6px; cursor: pointer;
      border: 1px solid transparent; display: flex; align-items: center; gap: 4px;
    }
    .cmp-item:hover { background: #f3f4f6; }
    .cmp-item.on { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .cmp-item .cn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cmp-item .tagx {
      font-size: 9px; padding: 1px 4px; border-radius: 4px; flex-shrink: 0;
      background: #eef2ff; color: #4338ca;
    }
    .cmp-item .tagx.hide { background: #f3f4f6; color: #9ca3af; }
    .cmp-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .cmp-main h4 { margin: 0; font-size: 13px; display: flex; align-items: center; gap: 8px; }
    .cmp-main h4 em { font-style: normal; font-size: 11px; color: #9ca3af; font-weight: 400; }
    .cmp-tpl {
      width: 100%; box-sizing: border-box; min-height: 190px; resize: vertical;
      font-family: Menlo, Consolas, monospace; font-size: 11px; line-height: 1.6;
      padding: 10px; border: 1px solid #e5e7eb; border-radius: 8px; color: #374151;
    }
    .cmp-tpl:focus { outline: 0; border-color: #2563eb; }
    .cmp-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cmp-row label { font-size: 12px; color: #6b7280; }
    .cmp-row input[type=text] {
      padding: 4px 8px; font-size: 12px; border: 1px solid #e5e7eb;
      border-radius: 6px; color: #374151;
    }
    .cmp-msg { font-size: 12px; line-height: 1.7; }
    .cmp-msg.bad { color: #991b1b; }
    .cmp-msg.warn { color: #92400e; }
    .cmp-msg.good { color: #065f46; }
    .cmp-msg ul { margin: 4px 0 0; padding-left: 18px; }
    .cmp-prev {
      border: 1px dashed #d1d5db; border-radius: 8px; padding: 10px;
      background: #fff; max-height: 260px; overflow: auto;
    }
    .cmp-prev-empty { color: #9ca3af; font-size: 12px; }
    .cmp-new {
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px;
      background: #f9fafb; display: none;
    }
    .cmp-new.show { display: block; }
    .cmp-new .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cmp-new .row span { width: 84px; font-size: 12px; color: #6b7280; flex-shrink: 0; }
    .cmp-new input[type=text], .cmp-new select {
      flex: 1; padding: 5px 8px; font-size: 12px; border: 1px solid #e5e7eb;
      border-radius: 6px; color: #374151; background: #fff;
    }
    .cmp-new em { display: block; font-size: 11px; color: #9ca3af; margin: -4px 0 8px 92px; }

    /* 元素树 + 属性面板：新增用户对Ras**
     * 元素是属性字典，所以每个样式项都能配一个控件。 */
    .etree {
      border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px;
      max-height: 260px; overflow: auto; background: #fafafa;
      width: 210px; flex-shrink: 0;
    }
    .etree .enode {
      display: flex; align-items: center; gap: 6px; padding: 3px 6px;
      border-radius: 5px; cursor: pointer; font-size: 12px; white-space: nowrap;
    }
    .etree .enode:hover { background: #f3f4f6; }
    .etree .enode.on { background: #eff6ff; color: #1d4ed8; }
    .etree .ety {
      font-size: 10px; padding: 1px 5px; border-radius: 4px;
      background: #e5e7eb; color: #4b5563; flex-shrink: 0; font-weight: 500;
    }
    .etree .enode.on .ety { background: #bfdbfe; }
    .etree .eco { color: #9ca3af; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
    .etree .enode.raw .ety { background: #fde68a; color: #92400e; }
    .eprops {
      flex: 1; min-width: 0; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 12px; max-height: 260px; overflow: auto;
      display: flex; flex-direction: column; gap: 6px;
    }
    .eprops .eph {
      font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 8px;
      padding-bottom: 6px; border-bottom: 1px solid #f3f4f6;
    }
    .eprops .eph em { font-style: normal; font-size: 11px; color: #9ca3af; font-weight: 400; }
    .eprow { display: flex; align-items: center; gap: 6px; }
    .eprow .epk { width: 92px; font-size: 12px; color: #6b7280; flex-shrink: 0; }
    .eprow input[type=text], .eprow select {
      flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 5px; color: #374151; background: #fff;
    }
    .eprow input[type=color] {
      width: 30px; height: 24px; padding: 0; flex: none;
      border: 1px solid #e5e7eb; border-radius: 4px; background: none; cursor: pointer;
    }
    .eprow input[type=number] { width: 74px; flex: none; padding: 4px 6px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 5px; color: #374151; }
    .eprow .unit { font-size: 11px; color: #9ca3af; flex: none; }
    .eprow.grp { padding-top: 6px; border-top: 1px solid #f3f4f6; }
    .epempty { color: #9ca3af; font-size: 12px; padding: 8px 0; }
  </style>
</head>

<body>
  <header>
    <div class="brand">公众号排版<span>本地渲染 · 零成本 · 干净复制</span></div>
    <div class="spacer"></div>
    <select id="themeSel" title="选择主题"></select>
    <button id="colorBtn">主题编辑</button>
    <button id="aiBtn">AI 用法</button>
    <button id="pubBtn">发布到草稿箱</button>
    <button id="sampleBtn">载入示例</button>
    <button id="copyBtn" class="primary" disabled>复制到公众号</button>
  </header>

  <main>
    <!-- 左：模块 -->
    <section class="col">
      <h2><span>模块</span><em>点击插入</em></h2>
      <div class="scroll" id="modules"></div>
      <div class="hint">不会写语法也能用：点一下，语法就插到中间。</div>
    </section>

    <!-- 中：语法 -->
    <section class="col">
      <h2><span>排版语法</span><em id="statBlocks"></em></h2>
      <div class="scroll" style="overflow:hidden;">
        <textarea id="md" spellcheck="false" placeholder="左边点模块，语法会出现在这里；也可以直接粘贴一篇 Markdown。"></textarea>
      </div>
    </section>

    <!-- 右：预览 -->
    <section class="col">
      <h2><span>预览</span><em id="statBytes"></em></h2>
      <div class="scroll">
        <div class="phone"><div id="preview"></div></div>
      </div>
      <div class="checkbar">
        <div class="bar" id="bar"></div>
        <div id="issues"></div>
      </div>
    </section>
  </main>

  <div class="mask" id="mask">
    <div class="modal">
      <h3>方式二：把稿子交给 AI 排版</h3>
      <div class="body" id="aiBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">提示词已就绪，复制后粘贴给任意 AI 即可</span>
        <div class="spacer"></div>
        <button id="aiCopy" class="primary">复制提示词</button>
        <button id="aiClose">关闭</button>
      </div>
    </div>
  </div>

  <!-- 主题编辑：配色 / 尺度 / 组件 三个页签共用一个弹层 -->
  <div class="mask" id="colorMask">
    <div class="modal" style="width:min(900px,94vw);">
      <h3>主题编辑 · 配色 / 尺度 / 组件<button id="colorClose" class="xbtn" title="关闭">×</button></h3>
      <div class="tabs" id="colorTabs">
        <button class="tab" data-tab="color">配色</button>
        <button class="tab" data-tab="scale">尺度</button>
        <button class="tab" data-tab="comp">组件</button>
      </div>
      <div class="body" id="colorBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">改动只存在本机，点「导出主题文件」才会固化成一套新主题</span>
        <div class="spacer"></div>
        <button id="colorImport">导入主题</button>
        <button id="colorReset">重置本页</button>
        <button id="colorExport" class="primary">导出主题文件</button>
      </div>
    </div>
  </div>

  <!-- 发布到草稿箱：配置 + 状态 -->
  <div class="mask" id="pubMask">
    <div class="modal" style="width:min(720px,94vw);">
      <h3>发布到公众号草稿箱<button id="pubClose" class="xbtn" title="关闭">×</button></h3>
      <div class="body" id="pubBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">密钥只存在本机浏览器里，不会写进主题文件，也不会上传给任何第三方</span>
        <div class="spacer"></div>
        <button id="pubClear">清除密钥</button>
        <button id="pubTest">测试连接</button>
        <button id="pubSend" class="primary">发送到草稿箱</button>
      </div>
    </div>
  </div>

  <input type="file" id="themeFile" accept=".js,.json" style="display:none;">
  <input type="file" id="thumbFile" accept="image/*" style="display:none;">

  <div class="toast" id="toast"></div>

  <!-- 内置示例，不用 fetch，保证 file:// 下也能载入 -->
  <script type="text/plain" id="sampleMd">:::masthead
## 这里写文章标题
kicker: 本期实测
issue: 2026.10
account: 风渡2077
tagline: AI 实测

一句话提炼，会显示在刊头卡的导语区。刊头卡默认不带封面图；想要封面就加一行 cover:（留空=占位图待替换，填网址=用真图）。
:::

  <script src="../themes/index.js"></script>

    (function () {

      var toastEl = $('toast');

      var order = window.GZH_THEME_ORDER || Object.keys(themes);
      var currentHTML = '';

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
      }

      /* ---------- 左栏模块：点了就把语法插到光标处 ----------
       *
       * ⚠️ 以前「刊头卡 / 基础信息」是 front-matter 预设，会被合并到文件开头的
       *    --- 区块里。后果：两个盒子互相绑定、插入位置被工具说了算，
       *    先插刊头卡再插基础信息，基础信息就跑到刊头卡旁边去了。
       *
       * 现在每个模块都是自包含的 ::: 盒子 —— **插在哪、就渲染在哪**。
       * once:true 只是提醒「这类盒子通常一篇一个」，不做强制拦截。
       */

      /* 左栏完全由 engine/modules.js 的注册表生成，这里不写死任何模块。
       * 新增一个组件：只改 engine/modules.js 一条，本文件一行都不用动。
       *
       * 输出形态：{ n, s, c, group, once }
       */
      function moduleEntries() {
        var flat = [];

        // 正式模块：ui 可以是单个对象，也可以是数组（同一 role 多个入口）。
        // 面板里「隐藏」的组件在这里被除名 —— 只是不给你看，模板还在。
        Object.keys(GZH.MODULES || {}).forEach(function (role) {

          var ui = GZH.MODULES[role].ui;
          if (!ui) return;                       // signature 这类自动生成的没有入口
          (Array.isArray(ui) ? ui : [ui]).forEach(function (u) {
            flat.push(Object.assign({}, u, { role: role }));
          });
        });

        return flat.map(function (u) {
          return {
            n: u.label, s: u.snippet, c: u.hint || '',
            group: u.group || '正文',
            once: !!u.once,
            role: u.role || ''
          };

      }

      var GROUPS = ['基础信息', '文章开头', '正文', '文章结尾'];

      function buildModules() {
        var box = $('modules');
        box.innerHTML = '';      // 会被反复调用（隐藏组件、新建组件），不清会越叠越多
        var entries = moduleEntries();

        GROUPS.forEach(function (g) {
          var list = entries.filter(function (e) { return e.group === g; });
          if (!list.length) return;

          var t = document.createElement('div');
          t.className = 'grp-title';
          t.textContent = g;
          box.appendChild(t);

          list.forEach(function (it) {

            b.className = 'mod' + (it.once ? ' once' : '');
            b.innerHTML = '<b>' + it.n + '</b><code>' + escHtml(it.c) + '</code>';
            b.title = it.once ? '全文只允许一个' : '';
            if (it.role) b.setAttribute('data-role', it.role);   // 隐藏 / 删除时要能精确定位

       *
       * 曾经有一整段 mergeFrontMatter 把模块合并到文件头的 --- 区块里，
       * 那正是「后插的跑到先插的位置」的根因，已删。

      function insert(it) {

        var pos = mdEl.selectionStart;
        var before = mdEl.value.slice(0, pos), after = mdEl.value.slice(pos);
        var lead = (before && !/\n\s*$/.test(before)) ? '\n\n' : '';
        var tail = (after && !/^\s*\n/.test(after)) ? '\n' : '';
        var seg = lead + text + tail;

        mdEl.value = before + seg + after;
        var caret = pos + seg.length;
        mdEl.focus();
        mdEl.setSelectionRange(caret, caret);

        toast('已插入「' + it.n + '」—— 就在这个位置，可以用鼠标拖到别处'
          + (it.once ? '（这类盒子通常一篇一个）' : '')
          + (it.n === '刊头卡' ? '。默认没有封面图，想要就加一行 cover:' : ''));
      }

      /* ---------- 主题加载 ----------
       *
       * 以前每套主题都要在 HTML 里手写一行 <script src>，加一套主题就得改本文件，
       * 这是「同一份信息写两遍」。现在只加载编译产物 themes/index.js（带 GZH_THEME_ORDER），
       * 再按清单逐个动态插入 script —— 加主题只需「丢 JSON + 跑编译」。
       * file:// 下动态插入普通 script 不走 CORS，已实测可用。
       */

      var LS_EXTRA = 'gzh.extraThemes';   // 导入过的主题 id 列表
      var LS_THEME = 'gzh.theme.';        // 导入过的主题本体

      // localStorage 在 file:// 下实测可写，但隐私模式下可能被禁 ——
      // 存不下不该让整个工具挂掉，所以全部读写都吞掉异常。
      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      function extraIds() {
        try {
          var arr = JSON.parse(lsGet(LS_EXTRA) || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }

      // 导入过的主题本体存在 localStorage，下次打开要还原；
      // 若 themes/ 里已经有同名文件，优先用文件（文件是权威来源）
      function restoreImported() {
        extraIds().forEach(function (id) {
          if (window.GZH_THEMES[id]) return;
          var raw = lsGet(LS_THEME + id);
          if (!raw) return;
          try { window.GZH_THEMES[id] = JSON.parse(raw); } catch (e) {}
        });
      }

      function loadThemeScripts(ids, done) {
        var i = 0, missing = [];
        (function next() {
          if (i >= ids.length) { done(missing); return; }
          var id = ids[i++];
          var s = document.createElement('script');
          s.src = '../themes/' + id + '.js';
          s.onload = next;
          s.onerror = function () { missing.push(id); next(); };
          document.head.appendChild(s);
        })();
      }

      function allThemeIds() {
        var seen = {}, out = [];
        (window.GZH_THEME_ORDER || []).concat(extraIds()).forEach(function (id) {
          if (seen[id]) return;
          seen[id] = 1;
          out.push(id);
        });
        return out;
      }

      function buildThemeOptions() {
        themes = window.GZH_THEMES || {};
        var prev = themeSel.value;
        themeSel.innerHTML = '';
        allThemeIds().forEach(function (id) {
          if (!themes[id]) return;
          var op = document.createElement('option');
          op.value = id;
          op.textContent = themes[id].name + ' · ' + id;
          themeSel.appendChild(op);
        });
        if (prev && themes[prev]) themeSel.value = prev;

      /* ---------- 改动层（overrides） ----------
       *
       * 面板里的所有改动先落在这里，不直接改原主题 —— 这样「切换主题」「重置」
       * 只是动这一小块，原主题始终干净；改坏了也能一键回到出厂。
       *
       * 四类改动必须**分开存**，因为它们最终落进主题的位置不同：
       *   tokens  → theme.tokens            颜色
       *   base    → theme.base              尺度（字号 / 行距 / 间距 / 对齐）
       *   tpl     → theme.components[x].tpl 某个组件的模板 HTML
       *   modules → 自定义组件（要注册进 GZH.MODULES，否则引擎不认识这个盒子）
       *   hidden  → 左栏不显示某个组件
       *
       * ⚠️ base 一定要写回 t.base：render 取值是 Object.assign(tokens, base, block)，
       * base 优先级高于 tokens，写进 tokens 会被原样盖掉 ——
       * 「改了间距没反应」就是这么来的。 */
      var overrides = { tokens: {}, base: {}, tpl: {}, item: {}, modules: {}, hidden: {}, tree: {} };
      var LS_OV = 'gzh.overrides.';

      function loadOverrides(id) {
        overrides = { tokens: {}, base: {}, tpl: {}, item: {}, modules: {}, hidden: {}, tree: {} };
        var raw = id ? lsGet(LS_OV + id) : null;

        syncCustomModules();
      }

      // （比如还没有 tree 这个分类），缺一个键就会在这里直接崩掉
      function ovCount() {
        return Object.keys(overrides.tokens || {}).length + Object.keys(overrides.base || {}).length
          + Object.keys(overrides.tpl || {}).length + Object.keys(overrides.item || {}).length
          + Object.keys(overrides.modules || {}).length + Object.keys(overrides.hidden || {}).length
          + Object.keys(overrides.tree || {}).length;
      }

      function currentTheme() {
        var base = themes[themeSel.value];
        if (!base || !ovCount()) return base;
        var t = JSON.parse(JSON.stringify(base));
        Object.keys(overrides.tokens).forEach(function (k) { t.tokens[k] = overrides.tokens[k]; });
        Object.keys(overrides.base).forEach(function (k) { t.base[k] = overrides.base[k]; });
        Object.keys(overrides.tpl).forEach(function (role) {
          if (t.components && t.components[role]) t.components[role].tpl = overrides.tpl[role];
        });
        Object.keys(overrides.item).forEach(function (role) {
          if (t.components && t.components[role]) t.components[role].item = overrides.item[role];
        });
        /* 元素树的优先级高于 tpl：render 的 pickComp 先取 compositions。
         * 所以「在元素面板里改过」之后，旧的 tpl 字符串自动让位，不需要手动清理。
         * overrides.tree[role] 本身就是 { tree, itemTree } 的形状，直接合进去 ——
         * 曾写成 { tree: overrides.tree[role] }，多套了一层，树就从数组变成了对象，
         * 症状是「改了数字预览纹丝不动」。 */
        Object.keys(overrides.tree).forEach(function (role) {
          t.compositions = t.compositions || {};
          t.compositions[role] = Object.assign({}, t.compositions[role], overrides.tree[role]);
        });
        return t;

       *
       * 骨架（这个盒子怎么取值）一直写在代码里，所以以前只能在已有的十几个挑。
       * 这里按 ir.js 的规矩现场造 grammar 塞进 GZH.MODULES —— ir.js 只读这张表，
       * 一行都不用改。三种取值方式覆盖了绝大多数需求，都是从内置组件抄来的形状。 */
      var GRAMMAR_PRESETS = {
        whole: { kind: 'container', static: {}, map: { label: 'label', text: 'join' } },
        kv: { kind: 'container', kv: true, static: {}, map: { label: 'label', text: 'join' } },
        list: { kind: 'container', static: {}, map: { label: 'label', items: 'lines' } }
      };

      function effectiveModules() {
        var t = themes[themeSel && themeSel.value];
        return Object.assign({}, (t && t.modules) || {}, overrides.modules || {});

      var CUSTOM_ROLES = [];

      function syncCustomModules() {
        // 先撤掉上一次注入的，否则删掉的组件会阴魂不散
        CUSTOM_ROLES.forEach(function (r) {
          var M = window.GZH && window.GZH.MODULES;
          if (M && M[r] && M[r].__custom) delete M[r];
          // FALLBACK 是 modules.js 加载时拍的快照，后注册的组件必须自己同步，
          // 否则 renderBlock 找不到 comp → 返回空字符串，盒子会**静默消失**
          if (window.GZH && window.GZH.FALLBACK) delete window.GZH.FALLBACK[r];
        });
        CUSTOM_ROLES = [];
        if (!window.GZH || !window.GZH.MODULES) return;

        // 两个来源都算：主题自带（导入别人的主题时会带过来）+ 你在这台机器上新建的。
        // 后写的优先，方便你对自带的那个再做修改。
        var baseT = themes[themeSel && themeSel.value];
        var merged = Object.assign({}, (baseT && baseT.modules) || {}, overrides.modules || {});

        Object.keys(merged).forEach(function (role) {
          var m = merged[role];
          var t = baseT;
          var srcComp = (t && t.components && t.components[m.from]) || null;
          var srcMod = window.GZH.MODULES[m.from] || {};
          var fb = srcMod.fallback || {};
          // 模板优先级：你自己改过的 > 起点组件在这套主题里的模板 > 起点组件的内置兜底
          var tpl = overrides.tpl[role] || (srcComp && srcComp.tpl) || fb.tpl || '';
          var item = overrides.item[role] || (srcComp && srcComp.item) || fb.item || '';

          var snippet = m.kind === 'list'
            ? ':::' + role + ' ' + m.name + '\n- 第一条\n- 第二条\n- 第三条\n:::\n'
            : m.kind === 'kv'
              ? ':::' + role + ' ' + m.name + '\nsubtitle: 副标题\n\n这里写正文。\n:::\n'
              : ':::' + role + ' ' + m.name + '\n这里写正文。\n:::\n';

          var entry = {
            __custom: true,
            ui: { label: m.name, group: m.group || '正文', snippet: snippet, hint: ':::' + role },
            grammar: JSON.parse(JSON.stringify(GRAMMAR_PRESETS[m.kind] || GRAMMAR_PRESETS.whole)),
            fallback: { tpl: tpl }
          };
          if (item) entry.fallback.item = item;
          if (m.source) entry.fallback.source = m.source;
          window.GZH.MODULES[role] = entry;
          if (window.GZH.FALLBACK) window.GZH.FALLBACK[role] = entry.fallback;
          CUSTOM_ROLES.push(role);
        });
      }
