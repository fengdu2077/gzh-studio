<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公众号排版 · 本地渲染</title>
  <style>
    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: -apple-system, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f6f8;
      color: #1f2937;
      font-size: 14px;
    }

    header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
    }

    .brand { font-size: 15px; font-weight: 600; color: #111827; }
    .brand span { color: #9ca3af; font-weight: 400; font-size: 12px; margin-left: 8px; }
    .spacer { flex: 1; }

    select, button {
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: #374151;
      cursor: pointer;
    }

    select:hover, button:hover { border-color: #9ca3af; }

    button.primary {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
      font-weight: 600;
    }

    button.primary:hover { background: #1d4ed8; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    /* ---------- 三栏：各自独立滚动 ---------- */
    main {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: 236px minmax(300px, 1fr) 470px;
      gap: 16px;
      padding: 16px;
      overflow: hidden;
    }

    @media (max-width: 1240px) {
      main { grid-template-columns: 210px minmax(280px, 1fr) 400px; }
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .col { height: 62vh; }
    }

    .col {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .col > h2 {
      flex: 0 0 auto;
      margin: 0;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #6b7280;
      background: #fafafa;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .col > h2 em {
      font-style: normal;
      font-weight: 400;
      color: #9ca3af;
      font-size: 11px;
    }

    .scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }

    /* ---------- 左栏：模块面板 ---------- */
    .grp-title {
      padding: 12px 14px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: .5px;
    }

    .mod {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0;
      padding: 8px 14px;
      background: transparent;
      cursor: pointer;
      color: #374151;
    }

    .mod:hover { background: #f3f4f6; border-left-color: #93c5fd; }
    .mod:active { background: #e5e7eb; }

    .mod b { display: block; font-size: 13px; font-weight: 500; }

    .mod code {
      display: block;
      margin-top: 3px;
      font-family: Menlo, Consolas, "Courier New", monospace;
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .mod.once { border-left-color: #fbbf24; }

    /* ---------- 中栏：语法编辑 ---------- */
    textarea {
      width: 100%;
      height: 100%;
      border: 0;
      padding: 14px 16px;
      font-family: Menlo, Consolas, "Courier New", monospace;
      font-size: 13px;
      line-height: 1.75;
      resize: none;
      outline: none;
      color: #374151;
      overflow-y: auto;
    }

    /* ---------- 右栏：预览 ---------- */
    .phone { background: #ffffff; padding: 18px 16px; }

    #preview {
      max-width: 375px;
      margin: 0 auto;
      background: #ffffff;
      word-wrap: break-word;
    }

    .checkbar {
      flex: 0 0 auto;
      background: #ffffff;
      border-top: 1px solid #e5e7eb;
      max-height: 168px;
      overflow-y: auto;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px 6px;
      font-size: 12px;
    }

    .chip {
      padding: 3px 9px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #4b5563;
      font-family: Menlo, Consolas, monospace;
    }

    .chip.bad { background: #fee2e2; color: #b91c1c; }
    .chip.good { background: #dcfce7; color: #15803d; }

    #issues { padding: 0 14px 12px; }

    .issue {
      font-size: 12px;
      line-height: 1.6;
      color: #b91c1c;
      background: #fef2f2;
      border-left: 3px solid #f87171;
      padding: 6px 10px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .ok-note {
      font-size: 12px;
      color: #15803d;
      background: #f0fdf4;
      border-left: 3px solid #4ade80;
      padding: 6px 10px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .hint-note {
      font-size: 12px;
      line-height: 1.7;
      color: #92400e;
      background: #fffbeb;
      border-left: 3px solid #fbbf24;
      padding: 7px 11px;
      margin-top: 6px;
      border-radius: 0 6px 6px 0;
    }

    .hint-note code {
      background: #fef3c7;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: Menlo, Consolas, monospace;
    }

    /* ---------- AI 提示词弹层 ---------- */
    .mask {
      position: absolute;
      inset: 0;
      background: rgba(17, 24, 39, .38);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .mask.show { display: flex; }

    .modal {
      width: min(720px, 92vw);
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
    }

    .modal > h3 {
      margin: 0;
      padding: 14px 18px;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 1px solid #e5e7eb;
    }

    .modal .body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px;
      font-size: 13px;
      line-height: 1.8;
      color: #374151;
    }

    .modal .body pre {
      margin: 10px 0;
      padding: 12px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal .foot {
      flex: 0 0 auto;
      padding: 12px 18px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .modal .foot .spacer { flex: 1; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: #111827;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 99;
      max-width: 76vw;
      text-align: center;
    }

    .toast.show { opacity: 1; }
    .hint { padding: 8px 14px; font-size: 12px; color: #9ca3af; line-height: 1.7; }

    .modal > h3 .xbtn {
      float: right; border: 0; background: none; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 2px; color: #9ca3af;
    }

    .crow {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid #f3f4f6;
    }
    .crow:last-child { border-bottom: 0; }
    .crow-k { flex: 1 1 auto; min-width: 0; }
    .crow-k b { display: block; font-size: 13px; font-weight: 600; color: #111827; }
    .crow-k em { display: block; font-style: normal; font-size: 11px; color: #9ca3af; }
    .crow input[type=color] {
      width: 46px; height: 30px; padding: 0; cursor: pointer;
      border: 1px solid #e5e7eb; border-radius: 6px; background: #fff;
    }
    .crow-v {
      font-family: Menlo, Consolas, monospace; font-size: 12px;
      color: #6b7280; min-width: 70px; text-align: right;
    }
    .crow-id input[type=text] {
      width: 148px; padding: 5px 8px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 6px; color: #374151;
    }
    .crow input[type=text] {
      padding: 5px 8px; font-size: 12px;
      border: 1px solid #e5e7eb; border-radius: 6px; color: #374151;
    }
    button.mini {
      padding: 5px 10px; font-size: 12px; border-radius: 6px;
      border: 1px solid #e5e7eb; background: #f9fafb; color: #374151;
    }
    button.mini:hover { background: #f3f4f6; }
    .pub-note {
      margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.7; background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb;
    }
    .pub-note.good { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .pub-note.bad { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .pub-note code {
      font-family: Menlo, Consolas, monospace; font-size: 11px;
      background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 4px;
    }
    .pub-help {
      margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12px;
      line-height: 1.8; background: #fffbeb; border: 1px solid #fde68a; color: #78350f;
    }
    .pub-pick-list {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px;
    }
    .pub-pick-item {
      cursor: pointer; border: 1px solid #e5e7eb; border-radius: 6px;
      overflow: hidden; background: #fff; text-align: center;
    }
    .pub-pick-item:hover { border-color: #2563eb; }
    .pub-pick-item img { width: 100%; height: 56px; object-fit: cover; display: block; }
    .pub-pick-item span {
      display: block; font-size: 10px; padding: 3px 4px; color: #6b7280;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">公众号排版<span>本地渲染 · 零成本 · 干净复制</span></div>
    <div class="spacer"></div>
    <select id="themeSel" title="选择主题"></select>
    <button id="colorBtn">配色</button>
    <button id="aiBtn">AI 用法</button>
    <button id="pubBtn">发布到草稿箱</button>
    <button id="sampleBtn">载入示例</button>
    <button id="copyBtn" class="primary" disabled>复制到公众号</button>
  </header>

  <main>
    <!-- 左：模块 -->
    <section class="col">
      <h2><span>模块</span><em>点击插入</em></h2>
      <div class="scroll" id="modules"></div>
      <div class="hint">不会写语法也能用：点一下，语法就插到中间。</div>
    </section>

    <!-- 中：语法 -->
    <section class="col">
      <h2><span>排版语法</span><em id="statBlocks"></em></h2>
      <div class="scroll" style="overflow:hidden;">
        <textarea id="md" spellcheck="false" placeholder="左边点模块，语法会出现在这里；也可以直接粘贴一篇 Markdown。"></textarea>
      </div>
    </section>

    <!-- 右：预览 -->
    <section class="col">
      <h2><span>预览</span><em id="statBytes"></em></h2>
      <div class="scroll">
        <div class="phone"><div id="preview"></div></div>
      </div>
      <div class="checkbar">
        <div class="bar" id="bar"></div>
        <div id="issues"></div>
      </div>
    </section>
  </main>

  <div class="mask" id="mask">
    <div class="modal">
      <h3>方式二：把稿子交给 AI 排版</h3>
      <div class="body" id="aiBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">提示词已就绪，复制后粘贴给任意 AI 即可</span>
        <div class="spacer"></div>
        <button id="aiCopy" class="primary">复制提示词</button>
        <button id="aiClose">关闭</button>
      </div>
    </div>
  </div>

  <div class="mask" id="colorMask">
    <div class="modal">
      <h3>配色 · 改完即时预览<button id="colorClose" class="xbtn" title="关闭">×</button></h3>
      <div class="body" id="colorBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">只改主色系 —— 阴影、链接、加粗、渐变端点会自动跟着变</span>
        <div class="spacer"></div>
        <button id="colorImport">导入主题</button>
        <button id="colorReset">重置</button>
        <button id="colorExport" class="primary">导出主题文件</button>
      </div>
    </div>
  </div>

  <!-- 发布到草稿箱：配置 + 状态 -->
  <div class="mask" id="pubMask">
    <div class="modal" style="width:min(720px,94vw);">
      <h3>发布到公众号草稿箱<button id="pubClose" class="xbtn" title="关闭">×</button></h3>
      <div class="body" id="pubBody"></div>
      <div class="foot">
        <span class="hint" style="padding:0;">密钥只存在本机浏览器里，不会写进主题文件，也不会上传给任何第三方</span>
        <div class="spacer"></div>
        <button id="pubClear">清除密钥</button>
        <button id="pubTest">测试连接</button>
        <button id="pubSend" class="primary">发送到草稿箱</button>
      </div>
    </div>
  </div>

  <input type="file" id="themeFile" accept=".js,.json" style="display:none;">
  <input type="file" id="thumbFile" accept="image/*" style="display:none;">

  <div class="toast" id="toast"></div>

  <!-- 内置示例，不用 fetch，保证 file:// 下也能载入 -->
  <script type="text/plain" id="sampleMd">:::masthead
## 这里写文章标题
kicker: 本期实测
issue: 2026.10
account: 风渡2077
tagline: AI 实测

一句话提炼，会显示在刊头卡的导语区。刊头卡默认不带封面图；想要封面就加一行 cover:（留空=占位图待替换，填网址=用真图）。
:::

:::highlights 本文看点
- 第一条看点，会自动编号成 01
- 第二条看点
- 第三条看点
:::

## 第一个章节 @THE CHALLENGE

刊头卡的封面图是可选的：盒子里不写 `cover` 就完全不出现图片；写一行 `cover:` 留空会放占位图（粘到公众号后点图替换）；填网址就是你的真图。

正文段落直接写就行，不用加任何标记。**加粗**会被渲染成深色强调，`行内代码`会渲染成浅底标签。

> 引用块会变成一张白底描边的引述卡，适合放原文照抄的内容。

:::note 结论 · VERDICT
这是左侧蓝条的结论卡，用来放你自己的判断。它和上面的引述卡不同，注意别混淆。
:::

图片单独一行放。**地址留空会自动落一张占位图**，粘到公众号后替换成你自己的图：

![]()

## 第二个章节 @BUILD IT

:::compare
## 方案甲 | 推荐
- 第一条理由
- 第二条理由
## 方案乙 | 不推荐
- 第一个问题
- 第二个问题
:::

视频同理 —— 公众号不能直接粘贴视频文件，所以这里会落一张占位图，
提示你去后台「素材库 → 视频」上传后再替换：

[20260917151241_rec-convert.mp4]

:::cta 想试试的话
按这个顺序走一遍就够了。
[点这里开始](https://example.com)
:::

---

:::profile
account: 风渡2077
author: 风渡
roleline: CREATOR · AI PRACTITIONER
bio: 这里是作者简介，一两句话说清楚你是谁、在写什么。
footer: 如果你觉得有收获，欢迎点赞、在看、转发三连。
:::

  <!-- 给 AI 的排版契约，与 docs/08-AI协作指南.md 同步 -->
  <script type="text/plain" id="aiPrompt">你是一个公众号排版助手。我会给你一篇用标准 Markdown 写的稿子，请你把它改写成下面这套「排版语法」，然后只输出改写后的全文，不要解释、不要输出 HTML。

# 动笔前必须先确认两项账号信息
这两项跟文章内容无关，是账号级别的，不能编造：
1. 公众号名称（account）
2. 作者名（author）
它们写在 :::profile 作者卡里，跟正文完全分开，所以必须在动笔前拿到。
如果我没有告诉你，就在输出完正文之后，单独写一行提醒：
「记得把 :::profile 里的 account 和 author 换成你自己的公众号名称和作者名。」

# 排版语法（核心规则：一个盒子管一件事）

每个盒子都用 ::: 包起来，**写在哪就渲染在哪**。不要把所有信息塞进文件头的 YAML 区块里，
那会让盒子互相绑定、位置不受控。

## 1. 刊头卡（全文最前面）
:::masthead
## 文章标题
kicker: 栏目名
issue: 2026.10
account: 公众号名称
tagline: 一句话定位

一句话导语，提炼全文最重要的那个结论。
:::
规则：cover 是封面图 URL，**可选**。不写 cover 就完全没有封面图；写 `cover:` 留空会放一张占位图（提醒你要替换）；填网址就是真图。不知道的字段就删掉整行，别写注释。

## 2. 作者卡（一个独立盒子；放开头就是作者简介，放文末就是署名区）
:::profile
account: 公众号名称
author: 作者名
roleline: 一行身份标签
bio: 一两句话简介
footer: 文末引导语
:::

## 3. 章节标题
## 中文标题 @ENGLISH_LABEL
@ 后面是 2~3 个单词的英文标签（如 THE CHALLENGE / BUILD IT / REFLECTION）。
序号会自动补，不要手写 01、02。末章也用普通编号，标签换 REFLECTION 或 SUMMARY。

## 4. 看点卡（章节 ≥3 个时才写，最多 3 条）
:::highlights 本文看点
- 第一条看点
- 第二条看点
- 第三条看点
:::

## 5. 正文块
- 普通段落直接写，**加粗**表示强调，`行内代码`表示专有名词
- 无序列表用 - ，有序列表用 1. 2. 3.（有序会渲染成序号标签，讲步骤时优先用有序）
- 引用别人的原话用 > 开头

## 6. 容器块（用 ::: 包起来）
:::note 结论 · VERDICT
放作者自己的判断、结论。
:::

:::compare
## 方案甲 | 推荐
- 第一条理由
## 方案乙 | 不推荐
- 第一个问题
:::

:::cta 想试试的话
引导读者做一个具体动作。
[按钮文字](链接)
:::

## 7. 媒体
- 图片：![](图片地址)，地址留空写成 ![]() 就自动放占位图
- 视频：[文件名.mp4]，公众号不能直接粘贴视频，会自动放占位图提示上传

## 8. 分隔线与文末
- 文中需要节奏断点时，单独一行写 ---，渲染成细线分隔（不带文字），可以有多条
- 全文最后一条 --- 会自动变成 END 收尾线，后面接 :::profile 作者卡收尾

# 使用纪律（必须遵守）
- 刊头卡、作者卡、END 各只能有 1 个
- 分隔线靠位置区分：文中是分隔线，文末最后一条才是 END
- :::cta 一篇最多 1 个，:::highlights 一篇最多 1 个
- 引述卡放别人的话，结论卡放自己的判断，不要混用
- 不要输出 HTML，不要输出文件头 YAML

现在，请把我的稿子改写成这套语法。</script>

  <script src="../engine/modules.js"></script>
  <script src="../engine/parse.js"></script>
  <script src="../engine/ir.js"></script>
  <script src="../engine/sanitize.js"></script>
  <script src="../engine/clipboard.js"></script>
  <script src="../engine/render.js"></script>

  <!-- 主题清单由 check/build_theme_js.py 生成；主题本体在下面按需动态加载。
       所以「往 themes/ 丢一个新 JSON + 跑一次编译」就够，本文件不用改 ——
       以前每加一套主题都得在这里手写一行 <script>，那是同一份信息写两遍。
       file:// 下动态插入普通 script 不走 CORS，已实测可用。 -->
  <script src="../themes/index.js"></script>

  <script>
    (function () {
      'use strict';

      var $ = function (id) { return document.getElementById(id); };
      var mdEl = $('md'), previewEl = $('preview'), barEl = $('bar');
      var issuesEl = $('issues'), themeSel = $('themeSel'), copyBtn = $('copyBtn');
      var toastEl = $('toast');

      var themes = window.GZH_THEMES || {};
      var order = window.GZH_THEME_ORDER || Object.keys(themes);
      var currentHTML = '';

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
      }

      /* ---------- 左栏模块：点了就把语法插到光标处 ----------
       *
       * ⚠️ 以前「刊头卡 / 基础信息」是 front-matter 预设，会被合并到文件开头的
       *    --- 区块里。后果：两个盒子互相绑定、插入位置被工具说了算，
       *    先插刊头卡再插基础信息，基础信息就跑到刊头卡旁边去了。
       *
       * 现在每个模块都是自包含的 ::: 盒子 —— **插在哪、就渲染在哪**。
       * once:true 只是提醒「这类盒子通常一篇一个」，不做强制拦截。
       */

      /* 左栏完全由 engine/modules.js 的注册表生成，这里不写死任何模块。
       * 新增一个组件：只改 engine/modules.js 一条，本文件一行都不用动。
       *
       * 输出形态：{ n, s, c, group, once }
       */
      function moduleEntries() {
        var flat = [];

        // 正式模块：ui 可以是单个对象，也可以是数组（同一 role 多个入口）
        Object.keys(GZH.MODULES || {}).forEach(function (role) {
          var ui = GZH.MODULES[role].ui;
          if (!ui) return;                       // signature 这类自动生成的没有入口
          (Array.isArray(ui) ? ui : [ui]).forEach(function (u) {
            flat.push(Object.assign({}, u));
          });
        });

        return flat.map(function (u) {
          return {
            n: u.label, s: u.snippet, c: u.hint || '',
            group: u.group || '正文',
            once: !!u.once
          };
        });
      }

      var GROUPS = ['基础信息', '文章开头', '正文', '文章结尾'];

      function buildModules() {
        var box = $('modules');
        var entries = moduleEntries();

        GROUPS.forEach(function (g) {
          var list = entries.filter(function (e) { return e.group === g; });
          if (!list.length) return;

          var t = document.createElement('div');
          t.className = 'grp-title';
          t.textContent = g;
          box.appendChild(t);

          list.forEach(function (it) {
            var b = document.createElement('button');
            b.className = 'mod' + (it.once ? ' once' : '');
            b.innerHTML = '<b>' + it.n + '</b><code>' + escHtml(it.c) + '</code>';
            b.title = it.once ? '全文只允许一个' : '';
            b.addEventListener('click', function () { insert(it); });
            box.appendChild(b);
          });
        });
      }

      function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      /* 插入就是「往光标处塞一段自包含的语法」，没有别的特殊处理。
       *
       * 曾经有一整段 mergeFrontMatter 把模块合并到文件头的 --- 区块里，
       * 那正是「后插的跑到先插的位置」的根因，已删。
       */
      function insert(it) {
        var text = it.s;
        var pos = mdEl.selectionStart;
        var before = mdEl.value.slice(0, pos), after = mdEl.value.slice(pos);
        var lead = (before && !/\n\s*$/.test(before)) ? '\n\n' : '';
        var tail = (after && !/^\s*\n/.test(after)) ? '\n' : '';
        var seg = lead + text + tail;

        mdEl.value = before + seg + after;
        var caret = pos + seg.length;
        mdEl.focus();
        mdEl.setSelectionRange(caret, caret);
        render();
        toast('已插入「' + it.n + '」—— 就在这个位置，可以用鼠标拖到别处'
          + (it.once ? '（这类盒子通常一篇一个）' : '')
          + (it.n === '刊头卡' ? '。默认没有封面图，想要就加一行 cover:' : ''));
      }

      /* ---------- 主题加载 ----------
       *
       * 以前每套主题都要在 HTML 里手写一行 <script src>，加一套主题就得改本文件，
       * 这是「同一份信息写两遍」。现在只加载编译产物 themes/index.js（带 GZH_THEME_ORDER），
       * 再按清单逐个动态插入 script —— 加主题只需「丢 JSON + 跑编译」。
       * file:// 下动态插入普通 script 不走 CORS，已实测可用。
       */

      var LS_EXTRA = 'gzh.extraThemes';   // 导入过的主题 id 列表
      var LS_THEME = 'gzh.theme.';        // 导入过的主题本体

      // localStorage 在 file:// 下实测可写，但隐私模式下可能被禁 ——
      // 存不下不该让整个工具挂掉，所以全部读写都吞掉异常。
      function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
      function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

      function extraIds() {
        try {
          var arr = JSON.parse(lsGet(LS_EXTRA) || '[]');
          return Array.isArray(arr) ? arr : [];
        } catch (e) { return []; }
      }

      // 导入过的主题本体存在 localStorage，下次打开要还原；
      // 若 themes/ 里已经有同名文件，优先用文件（文件是权威来源）
      function restoreImported() {
        extraIds().forEach(function (id) {
          if (window.GZH_THEMES[id]) return;
          var raw = lsGet(LS_THEME + id);
          if (!raw) return;
          try { window.GZH_THEMES[id] = JSON.parse(raw); } catch (e) {}
        });
      }

      function loadThemeScripts(ids, done) {
        var i = 0, missing = [];
        (function next() {
          if (i >= ids.length) { done(missing); return; }
          var id = ids[i++];
          var s = document.createElement('script');
          s.src = '../themes/' + id + '.js';
          s.onload = next;
          s.onerror = function () { missing.push(id); next(); };
          document.head.appendChild(s);
        })();
      }

      function allThemeIds() {
        var seen = {}, out = [];
        (window.GZH_THEME_ORDER || []).concat(extraIds()).forEach(function (id) {
          if (seen[id]) return;
          seen[id] = 1;
          out.push(id);
        });
        return out;
      }

      function buildThemeOptions() {
        themes = window.GZH_THEMES || {};
        var prev = themeSel.value;
        themeSel.innerHTML = '';
        allThemeIds().forEach(function (id) {
          if (!themes[id]) return;
          var op = document.createElement('option');
          op.value = id;
          op.textContent = themes[id].name + ' · ' + id;
          themeSel.appendChild(op);
        });
        if (prev && themes[prev]) themeSel.value = prev;
      }

      /* 用户在配色面板里改过的值，单独存而不是写回原主题对象。
       * 这样「切换主题」「重置」都只是动这一小块，原主题始终干净。 */
      var overrides = {};

      function currentTheme() {
        var base = themes[themeSel.value];
        if (!base || !Object.keys(overrides).length) return base;
        var t = JSON.parse(JSON.stringify(base));
        Object.keys(overrides).forEach(function (k) { t.tokens[k] = overrides[k]; });
        return t;
      }

      function render() {
        var md = mdEl.value;
        if (!md.trim()) {
          previewEl.innerHTML = '';
          barEl.innerHTML = '';
          issuesEl.innerHTML = '';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        var theme = currentTheme();
        if (!theme) {
          previewEl.innerHTML = '';
          barEl.innerHTML = '';
          issuesEl.innerHTML = '<div class="issue">还没有可用的主题。</div>';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        var ast, ir, html;
        // 发布面板要从 IR 里取标题/作者，存一份引用，避免为了取标题再解析一次稿子
        window.__gzhLastIR = null;
        try {
          ast = window.GZH.parse(md);
          ir = window.GZH.toIR(ast);
          html = window.GZH.render(ir, theme);
        } catch (e) {
          issuesEl.innerHTML = '<div class="issue">渲染失败：' + e.message + '</div>';
          currentHTML = '';
          copyBtn.disabled = true;
          return;
        }

        // 已上传过的图（base64 → 微信 URL）在这里套回去：
        // 上传一次，之后每次重渲染都直接用微信的地址，不用再传一遍
        html = applyImgMap(html);

        currentHTML = html;
        previewEl.innerHTML = html;
        window.__gzhLastIR = ir;

        $('statBlocks').textContent = ir.blocks.length + ' 个区块';
        $('statBytes').textContent = html.length.toLocaleString() + ' 字节';

        // 体检
        var v = window.GZH.verdict(window.GZH.metrics(html), theme.rules);
        var m = v.metrics;

        barEl.innerHTML = '';
        addChip('flex', m.flex, m.flex > 0, '布局容器');
        addChip('渐变', m.gradient, true, '');
        addChip('start', m.start, m.start === 0, '');
        addChip('left', m.left, m.left === 0, '');
        addChip('leaf', m.leafSpan, m.leafSpan > 0, '叶节点');
        addChip('污染', m.browserJunk, m.browserJunk === 0, '');
        addChip('模板', m.templateResidue, m.templateResidue === 0, '未替换标记');

        var hints = [];

        // 盒子字段是否齐全 —— 这几条是「用户根本不知道自己该填什么」的地方，必须明示
        var mh = null, pf = null;
        ir.blocks.forEach(function (b) {
          if (b.role === 'masthead') mh = b;
          if (b.role === 'profile') pf = b;
        });

        if (mh && mh.coverPlaceholder) {
          hints.push('刊头卡封面现在用的是<b>占位图</b>。想用自己的封面，就在 <code>:::masthead</code> 盒子里给 '
            + '<code>cover:</code> 填一个图片 URL（留空会一直用占位图；也可以粘到公众号后直接点图替换）。');
        }
        if (mh && !mh.account) {
          hints.push('还没填公众号名称：在 <code>:::masthead</code> 盒子里补一行 '
            + '<code>account: 你的公众号名</code>，刊头卡顶部眉标会显示它。');
        }
        if (!pf) {
          hints.push('这篇文章还没有<b>作者卡</b> —— 点左栏「作者卡」，盒子插在文末就是署名区。');
        } else if (!pf.author && !pf.account) {
          hints.push('作者卡里还是空的：至少填 <code>author:</code> 和 <code>account:</code> 两项。');
        }

        if (m.placeholder > 0) {
          hints.push('有 <b>' + m.placeholder + ' 处是占位图</b>（含封面/配图/视频）。'
            + '粘到公众号后，按图上的文字提示替换成你自己的素材 —— 视频要先在后台「素材库 → 视频」上传。');
        }
        if (m.tempLink > 0) {
          hints.push('检测到 <b>' + m.tempLink + ' 个临时图片链接</b>（飞书云文档 / 带签名参数的直链）。'
            + '这类链接<u>过几小时就会失效</u>，粘到公众号后会变成死图。'
            + '建议在语法里把它们改成 <code>![]()</code>，改用占位图。');
        }

        issuesEl.innerHTML = (v.ok
          ? '<div class="ok-note">体检通过，可以复制。</div>'
          : v.issues.map(function (s) { return '<div class="issue">' + s + '</div>'; }).join(''))
          + hints.map(function (s) { return '<div class="hint-note">' + s + '</div>'; }).join('');

        copyBtn.disabled = !v.ok;
      }

      function addChip(label, num, good, note) {
        var s = document.createElement('span');
        s.className = 'chip ' + (good ? 'good' : 'bad');
        s.textContent = label + ' ' + num + (note ? ' · ' + note : '');
        s.title = label + ' = ' + num;
        barEl.appendChild(s);
      }

      function copy() {
        if (!currentHTML) return;
        copyBtn.disabled = true;
        // 关键：走 ClipboardItem 直写原始字符串，绝不 selectNodeContents
        window.GZH.clipboard.write(currentHTML).then(function (r) {
          toast('已复制 ' + r.bytes.toLocaleString() + ' 字节，去编辑器粘贴吧');
          copyBtn.disabled = false;
        }).catch(function (e) {
          window.GZH.clipboard.writeFallback(previewEl).then(function (r) {
            toast('已降级为屏幕复制：' + (r.warn || '可能带入多余样式'));
            copyBtn.disabled = false;
          });
        });
      }

      /* ---------- AI 用法弹层 ---------- */
      var mask = $('mask');
      function openAI() {
        $('aiBody').innerHTML =
          '<p><b>怎么用：</b>把下面这段提示词复制给任意 AI（ChatGPT / Claude / 豆包 / Kimi 都行），'
          + '再把它写的稿子一起发过去。AI 会直接输出这套排版语法的全文，粘回中间这栏即可。</p>'
          + '<pre>' + escHtml($('aiPrompt').textContent.trim()) + '</pre>'
          + '<p style="color:#6b7280;">你不需要记任何语法 —— 记语法的活交给 AI。'
          + '本工具只负责把语法渲染成干净、可直贴公众号的 HTML。</p>';
        mask.classList.add('show');
      }
      function closeAI() { mask.classList.remove('show'); }

      $('aiBtn').addEventListener('click', openAI);
      $('aiClose').addEventListener('click', closeAI);
      mask.addEventListener('click', function (e) { if (e.target === mask) closeAI(); });
      $('aiCopy').addEventListener('click', function () {
        var txt = $('aiPrompt').textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () {
            toast('提示词已复制，粘给 AI 并把稿子一起发过去');
          }).catch(function () { toast('复制失败，请手动选中提示词复制'); });
        } else {
          toast('当前环境不支持一键复制，请手动选中复制');
        }
      });

      var debounce;
      mdEl.addEventListener('input', function () {
        clearTimeout(debounce);
        debounce = setTimeout(render, 220);
      });
      themeSel.addEventListener('change', render);
      copyBtn.addEventListener('click', copy);
      $('sampleBtn').addEventListener('click', function () {
        mdEl.value = $('sampleMd').textContent.trim();
        render();
        toast('已载入示例，改一改就能看到实时变化');
      });

      /* ---------- 配色面板 ----------
       *
       * 只暴露「跟主色走」的那几个 token，而不是把 15 个 token 全摊开：
       * 阴影、链接、加粗、渐变端点都是引用，改主色它们自己会跟，
       * 再给一遍旋钮只会让人不知道该动哪个。
       */
      var COLOR_KEYS = [
        ['accent', '主色', '标题、序号、强调'],
        ['accentSub', '副色', '次级强调'],
        ['accentSoft', '浅底', '行内代码底色、卡片淡底、渐变卡起点'],
        ['accentSoft2', '浅底 2', '更淡的底色、署名与行动卡渐变起点'],
        ['accentTint', '边框', '卡片描边'],
        ['accentTint2', '下划线', '链接下划线'],
        ['accentLine', '装饰线', '分隔线、渐变端点']
      ];

      var colorMask = $('colorMask'), colorBody = $('colorBody');

      function openColor() {
        var t = currentTheme();
        if (!t) { toast('先选一个主题'); return; }

        var html = '<p style="margin:0 0 12px;color:#6b7280;">改完右侧预览会立刻变。'
          + '满意了就点「导出主题文件」，拿到的是一个能直接用的主题文件。</p>'
          + '<p style="margin:0 0 12px;color:#92400e;">卡片和渐变线的底色由「浅底」决定，'
          + '只拖主色不会变 —— 想整套换色，7 个都要改。</p>';

        COLOR_KEYS.forEach(function (row) {
          var key = row[0], label = row[1], note = row[2];
          var val = (overrides[key] || t.tokens[key] || '#000000');
          html += '<div class="crow">'
            + '<span class="crow-k"><b>' + label + '</b><em>' + note + '</em></span>'
            + '<input type="color" value="' + val + '" data-k="' + key + '">'
            + '<code class="crow-v" data-v="' + key + '">' + val + '</code>'
            + '</div>';
        });

        html += '<div class="crow crow-id">'
          + '<span class="crow-k"><b>导出为</b><em>主题 id / 名称，随便起</em></span>'
          + '<input type="text" id="newThemeId" value="' + suggestId() + '">'
          + '<input type="text" id="newThemeName" value="' + suggestName() + '">'
          + '</div>';

        colorBody.innerHTML = html;

        Array.prototype.forEach.call(colorBody.querySelectorAll('input[type=color]'), function (inp) {
          inp.addEventListener('input', function () {
            var k = inp.getAttribute('data-k');
            overrides[k] = inp.value;
            var vEl = colorBody.querySelector('.crow-v[data-v="' + k + '"]');
            if (vEl) vEl.textContent = inp.value;
            render();
          });
        });

        colorMask.classList.add('show');
      }

      function closeColor() { colorMask.classList.remove('show'); }

      function suggestId() {
        var base = themeSel.value || 'theme';
        return base + '-custom';
      }
      function suggestName() {
        var t = currentTheme();
        return (t && t.name ? t.name : '主题') + '（自定义）';
      }

      function resetColor() {
        overrides = {};
        render();
        openColor();
        toast('已恢复为「' + (currentTheme().name || '') + '」原本的配色');
      }

      /* 导出的是一个「放进 themes/ 就能用」的 .js 文件，格式与
       * check/build_theme_js.py 的产物一致 —— 拿到的人不需要装 Python 重新编译。
       * 内容用全量快照而不是只存 diff：分享出去的主题必须自包含，
       * 不能假设对方机器上还有原来那套。 */
      function exportTheme() {
        var t = currentTheme();
        if (!t) { toast('先选一个主题'); return; }

        var id = ($('newThemeId') && $('newThemeId').value.trim()) || suggestId();
        var name = ($('newThemeName') && $('newThemeName').value.trim()) || suggestName();
        id = id.replace(/[^a-zA-Z0-9_-]/g, '-');

        var out = JSON.parse(JSON.stringify(t));
        out.id = id;
        out.name = name;
        out.derivedFrom = (themeSel.value || '') + (Object.keys(overrides).length ? '（改过配色）' : '');
        out.note = '由 App 配色面板导出。放进 themes/ 目录刷新即可，无需编译。';

        // 自己这套立刻可用：注册进 GZH_THEMES 并写进 localStorage，刷新后还在下拉里。
        // （不能只靠「丢进 themes/ 目录」—— 动态加载看的是 GZH_THEME_ORDER，
        //   而它是编译产物，不含手工放进去的文件。）
        window.GZH_THEMES[id] = out;
        var extras = extraIds();
        if (extras.indexOf(id) < 0) extras.push(id);
        lsSet(LS_THEME + id, JSON.stringify(out));
        lsSet(LS_EXTRA, JSON.stringify(extras));

        buildThemeOptions();
        themeSel.value = id;
        overrides = {};      // 改动已固化进新主题，覆盖层清掉
        render();

        // 下载的这份是给别人的：对方用「导入主题」打开即可，不用装 Python 重编译
        var js = '/* 自动生成，请勿手改。由 App 配色面板导出 */\n'
          + '(function(g){\n'
          + '  g.GZH_THEMES = g.GZH_THEMES || {};\n'
          + "  g.GZH_THEMES['" + id + "'] = "
          + JSON.stringify(out, null, 2) + ';\n'
          + '})(window);\n';

        var blob = new Blob([js], { type: 'application/javascript' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = id + '.js';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        toast('已存为「' + name + '」并在下拉里选中；' + id + '.js 也下载了，发给朋友用「导入主题」打开');
      }

      /* 导入：既能吃导出的 .js，也能吃源 .json。
       * .js 是固定格式的 IIFE，直接跑一次就会把自己注册进 GZH_THEMES。 */
      function importTheme(text, fname) {
        var before = Object.keys(window.GZH_THEMES || {});
        try {
          if (/\.json$/i.test(fname) || /^\s*\{/.test(text)) {
            var obj = JSON.parse(text);
            if (!obj || !obj.id) throw new Error('缺少 id 字段');
            window.GZH_THEMES[obj.id] = obj;
          } else {
            (new Function(text))();
          }
        } catch (e) {
          toast('这个文件读不了：' + e.message);
          return;
        }

        var added = Object.keys(window.GZH_THEMES).filter(function (k) {
          return before.indexOf(k) < 0;
        });
        if (!added.length) { toast('文件里没有新主题'); return; }

        var extras = extraIds();
        added.forEach(function (id) {
          if (extras.indexOf(id) < 0) extras.push(id);
          lsSet(LS_THEME + id, JSON.stringify(window.GZH_THEMES[id]));
        });
        lsSet(LS_EXTRA, JSON.stringify(extras));

        buildThemeOptions();
        themeSel.value = added[added.length - 1];
        overrides = {};
        render();
        toast('已导入「' + (window.GZH_THEMES[themeSel.value].name || themeSel.value) + '」');
      }

      $('colorBtn').addEventListener('click', openColor);
      $('colorClose') && $('colorClose').addEventListener('click', closeColor);
      colorMask.addEventListener('click', function (e) { if (e.target === colorMask) closeColor(); });
      $('colorReset').addEventListener('click', resetColor);
      $('colorExport').addEventListener('click', exportTheme);
      $('colorImport').addEventListener('click', function () { $('themeFile').click(); });
      $('themeFile').addEventListener('change', function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        var r = new FileReader();
        r.onload = function () { importTheme(String(r.result), file.name); };
        r.onerror = function () { toast('读文件失败'); };
        r.readAsText(file);
        ev.target.value = '';
      });

      /* ============================================================
       * 发布到公众号草稿箱
       *
       * 为什么不能直接在页面里 fetch 微信：
       *   api.weixin.qq.com 不返回 Access-Control-Allow-Origin，浏览器会直接拦掉
       *   （file:// 页面 origin 是 null，更严格）。所以请求必须先经过本机那个
       *   零依赖代理（tools/wechat-proxy.js），由它补 CORS 头再转发。
       *   代理只监听 127.0.0.1，且只能转发到 api.weixin.qq.com。
       *
       * 密钥存哪：localStorage（file:// 实测可写）。**不写进导出主题、不上传任何第三方。**
       * 这是权衡后的选择 —— 公众号后台的 IP 白名单 + 本机代理已经把风险压到很小，
       * 但 AppSecret 仍然是明文存在浏览器里，所以面板里给了「清除密钥」。
       * ============================================================ */
      var LS_PUB = 'gzh.publish';

      var pubCfg = (function () {
        try { return JSON.parse(lsGet(LS_PUB) || '{}') || {}; } catch (e) { return {}; }
      })();
      function savePub() { lsSet(LS_PUB, JSON.stringify(pubCfg)); }

      /* ---------- 正文图片映射 ----------
       * 微信草稿正文只认自己域下的图片（mmbiz.qpic.cn）。占位图是 base64 data URI，
       * 外链图也不保证显示 —— 正文里的图必须先传进公众号，拿到微信 URL 再替换掉。
       *
       * 上传结果按「图片内容」记一张映射表存 localStorage：
       *   同一个占位图不用重复传，之后每次重渲染也自动套回微信 URL。 */
      var LS_IMGMAP = 'gzh.imgmap';
      var imgMap = (function () {
        try { return JSON.parse(lsGet(LS_IMGMAP) || '{}') || {}; } catch (e) { return {}; }
      })();
      function saveImgMap() { lsSet(LS_IMGMAP, JSON.stringify(imgMap)); }

      // data URI 动辄几万字节，整条当 key 会把 localStorage 撑爆 —— 取首尾片段 + 长度
      function imgKey(src) {
        if (!src) return '';
        if (src.length <= 128) return src;
        return src.slice(0, 64) + '#' + src.length + '#' + src.slice(-24);
      }

      function applyImgMap(html) {
        if (!html) return html;
        if (!Object.keys(imgMap).length) return html;
        return html.replace(/<img([^>]*?)\ssrc="([^"]+)"/g, function (m, pre, src) {
          var wx = imgMap[imgKey(src)];
          return wx ? '<img' + pre + ' src="' + wx + '"' : m;
        });
      }

      // 把正文里的 <img src> 全扫一遍，按「能不能直接发」分类
      function scanImgs(html) {
        var out = [], seen = {};
        (html.match(/<img[^>]*\ssrc="[^"]+"/g) || []).forEach(function (tag) {
          var m = tag.match(/\ssrc="([^"]+)"/);
          if (!m) return;
          var src = m[1];
          if (seen[src]) return;
          seen[src] = 1;
          var kind = /^data:image\//i.test(src) ? 'base64'
            : /^https?:\/\/(mmbiz|res\.wx)\./i.test(src) ? 'wx'
              : /^https?:\/\//i.test(src) ? 'remote' : 'other';
          out.push({ src: src, kind: kind });
        });
        return out;
      }

      function dataURItoBlob(uri) {
        var m = String(uri).match(/^data:([^;,]+)(;base64)?,([\s\S]*)$/);
        if (!m) return null;
        var bin;
        try { bin = m[2] ? atob(m[3]) : decodeURIComponent(m[3]); }
        catch (e) { return null; }
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: m[1] || 'image/png' });
      }

      var pubMask = $('pubMask'), pubBody = $('pubBody');

      // 微信常见 errcode → 人话。尤其 40164（IP 白名单）必须先讲清楚，
      // 否则用户只会看到「invalid ip」，根本不知道要去后台加白名单。
      var WX_ERR = {
        40001: 'access_token 无效或已过期 —— 重新点「测试连接」取一个',
        40013: 'AppID 不对 —— 去公众号后台「基本配置」核对',
        40014: 'access_token 不合法',
        40125: 'AppSecret 不对 —— 去公众号后台「基本配置」重置或核对',
        40164: '调用方 IP 不在白名单 —— 把上面那个「本机公网 IP」加进公众号后台「设置与开发 › 基本配置 › IP白名单」',
        41001: '缺少 access_token',
        45009: '接口调用超过限额（草稿接口每天有限额）',
        48001: 'API 功能未授权 —— 订阅号/未认证号很多接口没有权限',
        53404: '账号已被限制调用该接口',
        45001: '多媒体文件超过大小限制',
        40007: '无效的 media_id —— 封面素材不存在或不是永久素材'
      };
      function wxErrText(data) {
        if (!data || data.errcode === undefined || data.errcode === 0) return '';
        var known = WX_ERR[data.errcode];
        return 'errcode ' + data.errcode + '：' + (known || data.errmsg || '未知错误')
          + (known ? '' : '（' + (data.errmsg || '') + '）');
      }

      function proxyBase() {
        return (pubCfg.proxy || 'http://127.0.0.1:8787').replace(/\/+$/, '');
      }

      // 统一的代理请求。代理没起时给出可操作的提示，而不是让用户面对一个 fetch 报错。
      function wxApi(path, query, body, cb) {
        var url = proxyBase() + '/wx/' + path + (query ? '?' + query : '');
        var opt = { method: body ? 'POST' : 'GET' };
        if (body) {
          if (body instanceof FormData) opt.body = body;                       // 素材上传（带 boundary）
          else { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
        }
        fetch(url, opt).then(function (r) {
          return r.text().then(function (t) {
            var d = null;
            try { d = JSON.parse(t); } catch (e) { d = { raw: t }; }
            cb(null, d);
          });
        }).catch(function (e) {
          cb(new Error('连不上本机代理（' + proxyBase() + '）。先在项目目录跑：node tools/wechat-proxy.js'
            + '　—— 浏览器不能直连微信 API，必须走这层。'));
        });
      }

      function proxyGet(path, cb) {
        fetch(proxyBase() + path).then(function (r) { return r.json(); })
          .then(function (d) { cb(null, d); })
          .catch(function (e) { cb(new Error('连不上本机代理（' + proxyBase() + '）。先跑：node tools/wechat-proxy.js')); });
      }

      function pubStatus(html, kind) {
        var el = $('pubStatus');
        if (el) el.innerHTML = '<div class="pub-note ' + (kind || '') + '">' + html + '</div>';
      }

      function openPub() {
        var t = currentTheme();
        pubBody.innerHTML = ''
          // ① 代理
          + '<div class="crow"><span class="crow-k"><b>本机代理</b>'
          + '<em>浏览器不能直连微信 API，必须走这层。在项目目录跑：<code>node tools/wechat-proxy.js</code></em></span>'
          + '<input type="text" id="pubProxy" style="width:190px" value="' + (pubCfg.proxy || 'http://127.0.0.1:8787') + '">'
          + '<button id="pubPing" class="mini">检测</button></div>'

          // ② 公网 IP
          + '<div class="crow"><span class="crow-k"><b>本机公网 IP</b>'
          + '<em>填进公众号后台「设置与开发 › 基本配置 › IP白名单」，不然拿不到 token（errcode 40164）</em></span>'
          + '<code class="crow-v" id="pubIp" style="min-width:110px;">' + (pubCfg.lastIp || '未获取') + '</code>'
          + '<button id="pubIpBtn" class="mini">查 IP</button>'
          + '<button id="pubIpCopy" class="mini">复制</button></div>'

          // ③ 密钥
          + '<div class="crow"><span class="crow-k"><b>AppID</b>'
          + '<em>公众号后台「设置与开发 › 基本配置」</em></span>'
          + '<input type="text" id="pubAppId" style="width:210px" value="' + (pubCfg.appId || '') + '" placeholder="wx........"></div>'
          + '<div class="crow"><span class="crow-k"><b>AppSecret</b>'
          + '<em>只存在本机浏览器，不写进主题文件、不外传</em></span>'
          + '<input type="password" id="pubSecret" style="width:210px" value="' + (pubCfg.appSecret || '') + '" placeholder="点「测试连接」才会用到">'
          + '<button id="pubEye" class="mini">显示</button></div>'

          // ④ 稿件字段
          + '<div class="crow"><span class="crow-k"><b>作者</b><em>留空则取稿子里 :::profile 的 author</em></span>'
          + '<input type="text" id="pubAuthor" style="width:210px" value="' + (pubCfg.author || '') + '"></div>'
          + '<div class="crow"><span class="crow-k"><b>原文链接</b><em>可选，文末「阅读原文」</em></span>'
          + '<input type="text" id="pubSrcUrl" style="width:210px" value="' + (pubCfg.sourceUrl || '') + '" placeholder="https://"></div>'
          + '<div class="crow"><span class="crow-k"><b>摘要</b><em>可选，留空微信会自动截取</em></span>'
          + '<input type="text" id="pubDigest" style="width:210px" value="' + (pubCfg.digest || '') + '"></div>'

          // ⑤ 封面（草稿接口必填 thumb_media_id）
          + '<div class="crow"><span class="crow-k"><b>封面 media_id</b>'
          + '<em>草稿接口必填。必须是素材库里的<b>永久图片</b>素材</em></span>'
          + '<input type="text" id="pubThumb" style="width:210px" value="' + (pubCfg.thumbMediaId || '') + '" placeholder="还没选">'
          + '<button id="pubPick" class="mini">从素材库选</button>'
          + '<button id="pubUpload" class="mini">上传一张</button></div>'

          // ⑥ 正文图片（草稿只认微信自家的图片地址）
          + '<div class="crow"><span class="crow-k"><b>正文图片</b>'
          + '<em>微信草稿不认 base64 占位图。点「上传并替换」把正文里的图传进公众号，自动换成微信 URL；'
          + '传过一次的图会记住，以后重渲染直接套用</em></span>'
          + '<code class="crow-v" id="pubImgStat" style="min-width:150px;">—</code>'
          + '<button id="pubImgUpload" class="mini">上传并替换</button>'
          + '<button id="pubImgMap" class="mini">清除映射</button></div>'
          + '<div class="crow"><span class="crow-k"><b>存入素材库</b>'
          + '<em>默认走「正文图片」接口：不占素材库张数配额，但后台素材库里看不到；'
          + '勾上则传成永久素材（占配额，可在素材库翻到、可复用）</em></span>'
          + '<label class="crow-v" style="display:flex;align-items:center;gap:6px;font-size:12px;">'
          + '<input type="checkbox" id="pubImgMaterial"' + (pubCfg.imgToMaterial ? ' checked' : '') + '> 传成永久素材</label></div>'

          + '<div id="pubStatus"></div>'
          + '<div class="pub-help">'
          + '<b>三个前提，缺一不可：</b>'
          + '① 公众号是<b>认证</b>的服务号/订阅号（未认证号没有草稿接口权限）；'
          + '② 本机公网 IP 已加进<b>IP 白名单</b>；'
          + '③ AppID / AppSecret 填对。'
          + '<br><b>正文图片：</b>占位图是 base64 内嵌图，微信认不了，发之前先点「上传并替换」。'
          + '默认走图文消息内图片接口（不占素材库配额），勾上「传成永久素材」才会进素材库。'
          + '<br>代理只在你需要发稿时开着，不发稿可以关掉（Ctrl+C）。'
          + '</div>';

        bindPub(t);
        pubMask.classList.add('show');
      }

      function bindPub(t) {
        function readCfg() {
          pubCfg.proxy = $('pubProxy').value.trim();
          pubCfg.appId = $('pubAppId').value.trim();
          pubCfg.appSecret = $('pubSecret').value;
          pubCfg.author = $('pubAuthor').value.trim();
          pubCfg.sourceUrl = $('pubSrcUrl').value.trim();
          pubCfg.digest = $('pubDigest').value.trim();
          pubCfg.thumbMediaId = $('pubThumb').value.trim();
          savePub();
        }
        ['pubProxy', 'pubAppId', 'pubSecret', 'pubAuthor', 'pubSrcUrl', 'pubDigest', 'pubThumb']
          .forEach(function (id) {
            var el = $(id);
            if (el) el.addEventListener('change', readCfg);
          });

        $('pubPing').addEventListener('click', function () {
          readCfg();
          proxyGet('/health', function (err, d) {
            pubStatus(err ? err.message
              : '代理正常 ✓（转发目标 ' + (d && d.upstream) + '）', err ? 'bad' : 'good');
          });
        });

        $('pubIpBtn').addEventListener('click', function () {
          pubStatus('正在查…');
          proxyGet('/ip', function (err, d) {
            if (err) { pubStatus(err.message, 'bad'); return; }
            if (d && d.ip) {
              pubCfg.lastIp = d.ip; savePub();
              $('pubIp').textContent = d.ip;
              pubStatus('你的公网出口 IP 是 <b>' + d.ip + '</b>。去公众号后台「设置与开发 › 基本配置 › IP白名单」'
                + '把它加进去，<b>保存后等 1 分钟</b>再回来测试连接。', 'good');
            } else pubStatus('没取到 IP：' + ((d && d.error) || '未知'), 'bad');
          });
        });

        $('pubIpCopy').addEventListener('click', function () {
          var ip = $('pubIp').textContent.trim();
          if (!ip || ip === '未获取') { pubStatus('先点「查 IP」', 'bad'); return; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(ip).then(function () { pubStatus('已复制 ' + ip, 'good'); })
              .catch(function () { pubStatus('复制失败，手动选中复制', 'bad'); });
          } else pubStatus('当前环境不支持一键复制，手动选中复制', 'bad');
        });

        $('pubEye').addEventListener('click', function () {
          var el = $('pubSecret');
          el.type = el.type === 'password' ? 'text' : 'password';
          this.textContent = el.type === 'password' ? '显示' : '隐藏';
        });

        $('pubUpload').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          $('thumbFile').click();
        });

        $('pubPick').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          pubStatus('正在取素材列表…');
          getToken(function (err, token) {
            if (err) { pubStatus(err.message || err, 'bad'); return; }
            wxApi('cgi-bin/material/batchget_material', 'access_token=' + encodeURIComponent(token),
              { type: 'image', offset: 0, count: 20 }, function (e2, d) {
                if (e2) { pubStatus(e2.message, 'bad'); return; }
                var bad = wxErrText(d);
                if (bad) { pubStatus(bad, 'bad'); return; }
                var items = (d && d.item) || [];
                if (!items.length) { pubStatus('素材库里还没有图片素材，先点「上传一张」', 'bad'); return; }
                var html = '<div class="pub-pick">点击选一张当封面：<div class="pub-pick-list">';
                items.forEach(function (it) {
                  html += '<div class="pub-pick-item" data-id="' + it.media_id + '" title="' + (it.name || '') + '">'
                    + '<img src="' + it.url + '"><span>' + (it.name || it.media_id) + '</span></div>';
                });
                html += '</div></div>';
                pubStatus(html, 'good');
                Array.prototype.forEach.call(pubBody.querySelectorAll('.pub-pick-item'), function (el) {
                  el.addEventListener('click', function () {
                    $('pubThumb').value = el.getAttribute('data-id');
                    pubCfg.thumbMediaId = el.getAttribute('data-id'); savePub();
                    pubStatus('已选封面 media_id：<code>' + el.getAttribute('data-id') + '</code>', 'good');
                  });
                });
              });
          });
        });

        $('pubImgUpload').addEventListener('click', function () {
          readCfg();
          if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
          if ($('pubImgMaterial')) { pubCfg.imgToMaterial = $('pubImgMaterial').checked; savePub(); }
          replaceArticleImgs();
        });

        $('pubImgMap').addEventListener('click', function () {
          var n = Object.keys(imgMap).length;
          if (!n) { pubStatus('映射表是空的 —— 还没上传过图片', 'bad'); return; }
          if (!window.confirm('清除已记住的 ' + n + ' 张图片地址？\n之后重渲染会退回 base64 占位图，需要重新上传。')) return;
          imgMap = {}; saveImgMap();
          render(); refreshImgStat();
          pubStatus('已清除 ' + n + ' 条图片映射', 'good');
        });

        if ($('pubImgMaterial')) $('pubImgMaterial').addEventListener('change', function () {
          pubCfg.imgToMaterial = this.checked; savePub();
        });

        refreshImgStat();
      }

      // access_token 现取现用（7200 秒有效），不落盘 —— 落盘就要处理过期与多页面竞争
      function getToken(cb) {
        if (!pubCfg.appId || !pubCfg.appSecret) {
          cb(new Error('还没填 AppID / AppSecret')); return;
        }
        wxApi('cgi-bin/token',
          'grant_type=client_credential&appid=' + encodeURIComponent(pubCfg.appId)
          + '&secret=' + encodeURIComponent(pubCfg.appSecret), null, function (err, d) {
            if (err) { cb(err); return; }
            if (!d || !d.access_token) { cb(new Error(wxErrText(d) || '没拿到 access_token')); return; }
            cb(null, d.access_token);
          });
      }

      /* 上传一张图到公众号，换回一个能直接写进正文的 URL。
       *
       * 两条接口，差别要说清：
       *   media/uploadimg        —— 图文消息内的图片。**不占素材库配额**，
       *                            但只收 jpg/png、≤1MB，**不会出现在素材库里**。正文用这个就够。
       *   material/add_material  —— 永久素材。**占素材库张数配额**，能在后台素材库里翻到、可复用（封面就是它）。
       * 默认走前者；图超 1MB 或不是 jpg/png 时自动回退到后者（上限 10MB）。 */
      function uploadImg(src, toMaterial, cb) {
        var blob = dataURItoBlob(src);
        if (!blob) { cb(new Error('读不出这张图的二进制 —— 目前只支持正文里内嵌的 base64 图')); return; }

        var t = blob.type || 'image/png';
        var small = /(jpeg|jpg|png)/i.test(t) && blob.size <= 1024 * 1024;
        var useMaterial = !!toMaterial || !small;

        var ext = /png/i.test(t) ? 'png' : /gif/i.test(t) ? 'gif' : /webp/i.test(t) ? 'webp' : 'jpg';
        var fd = new FormData();
        fd.append('media', blob, 'gzh-' + Date.now() + '.' + ext);

        getToken(function (err, token) {
          if (err) { cb(err); return; }
          var q = 'access_token=' + encodeURIComponent(token);
          if (useMaterial) {
            wxApi('cgi-bin/material/add_material', q + '&type=image', fd, function (e, d) {
              if (e) { cb(e); return; }
              var bad = wxErrText(d);
              if (bad) { cb(new Error(bad)); return; }
              if (!d || !d.url) { cb(new Error('微信没返回 url：' + JSON.stringify(d).slice(0, 120))); return; }
              cb(null, d.url, d.media_id || '', true);
            });
          } else {
            wxApi('cgi-bin/media/uploadimg', q, fd, function (e, d) {
              if (e) { cb(e); return; }
              var bad = wxErrText(d);
              if (bad) { cb(new Error(bad)); return; }
              if (!d || !d.url) { cb(new Error('微信没返回 url：' + JSON.stringify(d).slice(0, 120))); return; }
              cb(null, d.url, '', false);
            });
          }
        });
      }

      // 面板上那一行统计：正文里到底有几张图、几张还没传
      function refreshImgStat() {
        var el = $('pubImgStat');
        if (!el) return;
        var list = scanImgs(currentHTML || '');
        // 换过地址的图 src 已经是微信 URL，得靠反查映射表才知道「这张是我们传的」
        var vals = {};
        Object.keys(imgMap).forEach(function (k) { vals[imgMap[k]] = 1; });
        var need = 0, done = 0, wx = 0, other = 0;
        list.forEach(function (it) {
          if (vals[it.src]) done++;
          else if (it.kind === 'wx') wx++;
          else if (it.kind === 'base64') need++;
          else other++;
        });
        el.textContent = list.length
          ? list.length + ' 张 · 已上传 ' + done + ' · 待上传 ' + need
          + (wx ? ' · 微信图 ' + wx : '') + (other ? ' · 外链 ' + other : '')
          : '正文里没有图片';
      }

      /* 批量上传：串行跑（并发容易撞频率限制），逐张记映射，失败的单独报出来。
       * 全部结束后把映射套回正文并重画预览 —— 体检区会立刻看到 base64 清零。 */
      function replaceArticleImgs() {
        if (!currentHTML) { pubStatus('正文还是空的', 'bad'); return; }
        var list = scanImgs(currentHTML);
        var todo = list.filter(function (it) { return it.kind === 'base64' && !imgMap[imgKey(it.src)]; });
        var other = list.filter(function (it) { return it.kind === 'remote' || it.kind === 'other'; }).length;

        if (!todo.length) {
          pubStatus('没有需要上传的图 ✓（正文共 ' + list.length + ' 张）'
            + (other ? '　注意：还有 ' + other + ' 张外链/本地图，微信不保证显示，建议手动换掉。' : ''), 'good');
          return;
        }

        var toMaterial = $('pubImgMaterial') && $('pubImgMaterial').checked;
        var i = 0, ok = 0, fails = [];

        (function step() {
          if (i >= todo.length) {
            currentHTML = applyImgMap(currentHTML);
            previewEl.innerHTML = currentHTML;
            $('statBytes').textContent = currentHTML.length.toLocaleString() + ' 字节';
            refreshImgStat();
            pubStatus('上传完成 ✓ ' + ok + '/' + todo.length + ' 张已换成微信地址'
              + (toMaterial ? '（已存入素材库）' : '（走正文图片接口，不占素材库配额）')
              + (fails.length ? '<br>失败 ' + fails.length + ' 张：' + escHtml(fails[0]) : '')
              + (other ? '<br>另有 ' + other + ' 张外链/本地图没动（微信不保证显示）' : '')
              + '<br>可以点「发送到草稿箱」了。', fails.length ? 'bad' : 'good');
            return;
          }
          var src = todo[i].src;
          pubStatus('正在上传第 ' + (i + 1) + '/' + todo.length + ' 张…（约 ' + Math.round(src.length / 1365) + ' KB）');
          uploadImg(src, toMaterial, function (err, url) {
            if (err) fails.push(err.message || String(err));
            else { imgMap[imgKey(src)] = url; saveImgMap(); ok++; }
            i++; step();
          });
        })();
      }

      function testConn() {
        readAllPub();
        pubStatus('正在取 access_token…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }
          pubStatus('连接正常 ✓ access_token 已拿到（' + token.slice(0, 10) + '…），有效期 2 小时。'
            + '可以点「发送到草稿箱」了。', 'good');
        });
      }

      function readAllPub() {
        if ($('pubProxy')) {
          pubCfg.proxy = $('pubProxy').value.trim();
          pubCfg.appId = $('pubAppId').value.trim();
          pubCfg.appSecret = $('pubSecret').value;
          pubCfg.author = $('pubAuthor').value.trim();
          pubCfg.sourceUrl = $('pubSrcUrl').value.trim();
          pubCfg.digest = $('pubDigest').value.trim();
          pubCfg.thumbMediaId = $('pubThumb').value.trim();
          savePub();
        }
      }

      /* 发送草稿
       *
       * 草稿接口有两个硬要求，都会在发送前拦住：
       *   1. thumb_media_id 必填（封面必须是素材库里的永久图片）
       *   2. 正文里的图片必须是**微信素材库的 URL**。
       *      占位图是 base64 data URI，微信不认 —— 所以先数一遍，提醒用户替换。 */
      function sendDraft() {
        readAllPub();
        if (!pubCfg.appId || !pubCfg.appSecret) { pubStatus('先填 AppID / AppSecret', 'bad'); return; }
        if (!pubCfg.thumbMediaId) {
          pubStatus('还缺封面 media_id —— 草稿接口必填。点「上传一张」或「从素材库选」。', 'bad'); return;
        }
        if (!currentHTML) { pubStatus('正文还是空的', 'bad'); return; }

        // currentHTML 已经套过映射，这里剩下的 base64 才是真没传的
        var left = scanImgs(currentHTML).filter(function (it) { return it.kind === 'base64'; }).length;
        if (left > 0 && !window.confirm('正文里还有 ' + left + ' 张 base64 内嵌图，'
          + '微信草稿不认，发出去显示不出来。\n\n'
          + '建议先关掉这个框，点「正文图片 › 上传并替换」，传完再发。\n\n仍要直接发送吗？')) {
          pubStatus('已取消 —— 先点「正文图片 › 上传并替换」', 'bad'); return;
        }

        pubStatus('正在取 access_token…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }

          // 标题：front-matter / :::masthead 的 title，退一步取首个 # 标题，再退一步取日期
          var title = pubCfg.title || articleTitle() || ('未命名 ' + new Date().toISOString().slice(0, 10));
          var author = pubCfg.author || articleAuthor();

          pubStatus('正在提交草稿…');
          wxApi('cgi-bin/draft/add', 'access_token=' + encodeURIComponent(token), {
            articles: [{
              title: title,
              author: author,
              digest: pubCfg.digest || '',
              content: currentHTML,
              content_source_url: pubCfg.sourceUrl || '',
              thumb_media_id: pubCfg.thumbMediaId,
              need_open_comment: 0,
              only_fans_can_comment: 0
            }]
          }, function (e2, d) {
            if (e2) { pubStatus(e2.message, 'bad'); return; }
            var bad = wxErrText(d);
            if (bad) { pubStatus(bad, 'bad'); return; }
            pubCfg.lastDraftId = d.media_id; savePub();
            pubStatus('已写入草稿箱 ✓<br>标题：' + escHtml(title) + '<br>media_id：<code>' + d.media_id + '</code>'
              + '<br><a href="https://mp.weixin.qq.com/" target="_blank">打开公众号后台看草稿</a>', 'good');
          });
        });
      }

      // 从 IR 里找标题/作者：不重新解析一次 Markdown，直接复用上次渲染的 IR
      function lastIR() { return window.__gzhLastIR || null; }
      function articleTitle() {
        var ir = lastIR();
        if (!ir) return '';
        for (var i = 0; i < ir.blocks.length; i++) {
          if (ir.blocks[i].role === 'masthead' && ir.blocks[i].title) return ir.blocks[i].title;
        }
        return '';
      }
      function articleAuthor() {
        var ir = lastIR();
        if (!ir) return '';
        for (var i = 0; i < ir.blocks.length; i++) {
          var b = ir.blocks[i];
          if ((b.role === 'profile' || b.role === 'signature') && (b.author || b.account)) return b.author || b.account;
        }
        return '';
      }

      function closePub() { pubMask.classList.remove('show'); }

      $('pubBtn').addEventListener('click', openPub);
      $('pubClose').addEventListener('click', closePub);
      pubMask.addEventListener('click', function (e) { if (e.target === pubMask) closePub(); });
      $('pubTest').addEventListener('click', testConn);
      $('pubSend').addEventListener('click', sendDraft);
      $('pubClear').addEventListener('click', function () {
        if (!window.confirm('清除本机保存的 AppID / AppSecret？（封面 media_id、代理地址等配置会保留）')) return;
        pubCfg.appId = ''; pubCfg.appSecret = ''; savePub();
        if ($('pubAppId')) $('pubAppId').value = '';
        if ($('pubSecret')) $('pubSecret').value = '';
        pubStatus('已清除 AppID / AppSecret', 'good');
      });

      $('thumbFile').addEventListener('change', function (ev) {
        var file = ev.target.files && ev.target.files[0];
        ev.target.value = '';
        if (!file) return;
        pubStatus('正在上传封面…');
        getToken(function (err, token) {
          if (err) { pubStatus(err.message || String(err), 'bad'); return; }
          var fd = new FormData();
          fd.append('media', file, file.name);
          wxApi('cgi-bin/material/add_material',
            'access_token=' + encodeURIComponent(token) + '&type=image', fd, function (e2, d) {
              if (e2) { pubStatus(e2.message, 'bad'); return; }
              var bad = wxErrText(d);
              if (bad) { pubStatus(bad, 'bad'); return; }
              pubCfg.thumbMediaId = d.media_id; savePub();
              if ($('pubThumb')) $('pubThumb').value = d.media_id;
              pubStatus('封面已上传 ✓ media_id：<code>' + d.media_id + '</code>（' + escHtml(file.name) + '）', 'good');
            });
        });
      });

      buildModules();

      loadThemeScripts(window.GZH_THEME_ORDER || [], function (missing) {
        restoreImported();
        buildThemeOptions();
        render();
        if (missing.length) toast('有几个主题没加载到：' + missing.join('、'));
      });
    })();
  </script>
</body>

</html>
